<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Choice Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111;
}

.header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

.header h1{
margin:0 0 12px;
}

.container{
max-width:950px;
margin:auto;
padding:15px;
}

button{
border:0;
cursor:pointer;
padding:11px 16px;
border-radius:8px;
font-weight:bold;
}

.refresh{
background:#2563eb;
color:white;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.stat{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat strong{
display:block;
font-size:28px;
margin-top:8px;
}

.section{
background:white;
padding:18px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
}

.section h2{
margin-top:0;
}

.order,
.booking,
.menu-card{
background:white;
padding:16px;
margin-top:15px;
border-radius:10px;
box-shadow:0 2px 7px #ddd;
}

.header-row{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
}

.status{
background:#f59e0b;
color:white;
padding:6px 10px;
border-radius:20px;
font-size:13px;
}

.info{
line-height:1.8;
margin-top:10px;
}

.items{
background:#f8fafc;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.item{
padding:7px 0;
border-bottom:1px solid #ddd;
}

.total{
font-size:19px;
font-weight:bold;
margin-top:12px;
}

.contact{
display:flex;
gap:10px;
margin-top:10px;
}

.call{
background:#2563eb;
color:white;
}

.whatsapp{
background:#16a34a;
color:white;
}

select,
input,
textarea{
width:100%;
padding:11px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
background:white;
}

textarea{
min-height:80px;
resize:vertical;
}

.update{
width:100%;
margin-top:10px;
background:#16a34a;
color:white;
}

.delete{
background:#dc2626;
color:white;
width:100%;
margin-top:10px;
}

.edit{
background:#2563eb;
color:white;
width:100%;
margin-top:10px;
}

.add-btn{
background:#16a34a;
color:white;
width:100%;
margin-top:12px;
}

.cancel-btn{
background:#6b7280;
color:white;
width:100%;
margin-top:10px;
}

.form-box{
background:#f8fafc;
padding:15px;
border-radius:10px;
margin-bottom:18px;
}

.form-box label{
display:block;
font-weight:bold;
margin-top:10px;
}

.menu-image{
width:100%;
max-width:180px;
height:130px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
background:#eee;
}

.menu-price{
font-size:20px;
font-weight:bold;
margin-top:8px;
}

.available{
background:#16a34a;
color:white;
padding:5px 9px;
border-radius:15px;
font-size:12px;
}

.unavailable{
background:#dc2626;
color:white;
padding:5px 9px;
border-radius:15px;
font-size:12px;
}

.success{
background:#dcfce7;
color:#166534;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.loading{
text-align:center;
padding:20px;
}

.no-data{
text-align:center;
padding:20px;
color:#666;
}

.menu-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.menu-actions button{
width:100%;
}

@media(max-width:600px){

.stats{
grid-template-columns:1fr;
}

.contact{
flex-direction:column;
}

.contact button{
width:100%;
}

.menu-actions{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

<h1>🍽️ Your Choice Admin</h1>

<button
class="refresh"
onclick="loadAll()">
🔄 Refresh All
</button>

</div>


<div class="container">


<!-- ========================= -->
<!-- STATISTICS -->
<!-- ========================= -->

<div class="stats">

<div class="stat">
Total Orders
<strong id="totalOrders">0</strong>
</div>

<div class="stat">
Pending Orders
<strong id="pendingOrders">0</strong>
</div>

<div class="stat">
Total Sales
<strong>
₹<span id="totalSales">0</span>
</strong>
</div>

</div>


<!-- ========================= -->
<!-- ORDERS -->
<!-- ========================= -->

<div class="section">

<h2>📦 Customer Orders</h2>

<div id="orders"
class="loading">
Loading orders...
</div>

</div>


<!-- ========================= -->
<!-- BOOKINGS -->
<!-- ========================= -->

<div class="section">

<h2>📅 Table Bookings</h2>

<div id="bookings"
class="loading">
Loading bookings...
</div>

</div>


<!-- ========================= -->
<!-- MENU -->
<!-- ========================= -->

<div class="section">

<h2>🍽️ Menu Management</h2>


<!-- ADD MENU -->

<div class="form-box">

<h3 id="formTitle">
➕ Add New Food
</h3>


<label>
Food Name
</label>

<input
id="menuName"
type="text"
placeholder="Example: Chicken Biryani">


<label>
Category
</label>

<input
id="menuCategory"
type="text"
placeholder="Example: Biryani">


<label>
Description
</label>

<textarea
id="menuDescription"
placeholder="Food description"></textarea>


<label>
Price
</label>

<input
id="menuPrice"
type="number"
placeholder="Example: 220">


<label>
Image Path / URL
</label>

<input
id="menuImage"
type="text"
placeholder="images/chicken-biryani.jpg">


<label>
Availability
</label>

<select id="menuAvailable">

<option value="1">
🟢 Available
</option>

<option value="0">
🔴 Unavailable
</option>

</select>


<button
id="saveMenuBtn"
class="add-btn"
onclick="saveMenu()">

➕ Add Food

</button>


<button
id="cancelEditBtn"
class="cancel-btn"
onclick="cancelEdit()"
style="display:none;">

❌ Cancel Edit

</button>


<div id="menuFormResult"></div>

</div>


<!-- MENU LIST -->

<h3>
📋 Current Menu
</h3>

<div id="menuList"
class="loading">

Loading menu...

</div>

</div>


</div>


<script>


// =====================================
// API
// =====================================

const API =
"https://1251file.xboy7334.workers.dev";

let editingMenuId = null;


// =====================================
// LOAD ALL
// =====================================

function loadAll(){

loadOrders();

loadBookings();

loadMenu();

}


// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders(){

const box =
document.getElementById("orders");

try{

const response =
await fetch(
API + "/api/admin/orders?x=" +
Date.now()
);

const data =
await response.json();

if(!data.success){

throw new Error(
"Order API failed"
);

}

const orders =
data.orders || [];


document.getElementById(
"totalOrders"
).textContent =
orders.length;


let pending = 0;
let sales = 0;


orders.forEach(function(order){

if(order.status === "Pending"){
pending++;
}

sales += Number(
order.total_amount || 0
);

});


document.getElementById(
"pendingOrders"
).textContent =
pending;


document.getElementById(
"totalSales"
).textContent =
sales.toFixed(0);


if(orders.length === 0){

box.innerHTML =
"<div class='no-data'>No orders found.</div>";

return;

}


box.className = "";

box.innerHTML = "";


orders.forEach(function(order){

let items = "";


(order.items || [])
.forEach(function(item){

items += `
<div class="item">
${item.item_name}
× ${item.quantity}
— ₹${Number(item.price) *
Number(item.quantity)}
</div>
`;

});


const phone =
String(order.phone || "")
.replace(/\D/g,"");


box.innerHTML += `

<div class="order">

<div class="header-row">

<h3>
📦 Order #${order.id}
</h3>

<span class="status">
${order.status || "Pending"}
</span>

</div>


<div class="info">

<b>Customer:</b>
${order.customer_name || "-"}
<br>

<b>Phone:</b>
${order.phone || "-"}


<div class="contact">

<button
class="call"
onclick="callCustomer('${phone}')">
📞 Call
</button>

<button
class="whatsapp"
onclick="sendWhatsApp('${phone}','${order.id}')">
💬 WhatsApp
</button>

</div>


<br>

<b>Address:</b>
${order.address || "-"}

<br>

<b>Payment:</b>
${order.payment_method || "COD"}

<br>

<b>Date:</b>
${order.created_at || ""}

</div>


<div class="items">

<b>Items</b>

${items}

</div>


<div class="total">

Total:
₹${order.total_amount}

</div>


<select id="orderStatus${order.id}">

<option value="Pending">🟡 Pending</option>

<option value="Confirmed">🔵 Confirmed</option>

<option value="Preparing">🟠 Preparing</option>

<option value="Delivered">🟢 Delivered</option>

<option value="Cancelled">🔴 Cancelled</option>

</select>


<button
class="update"
onclick="updateOrder(${order.id})">

✅ Update Order Status

</button>


<div id="orderResult${order.id}">
</div>

</div>

`;

document.getElementById(
"orderStatus" + order.id
).value =
order.status || "Pending";

});

}catch(error){

box.innerHTML = `
<div class="error">
❌ Orders load হচ্ছে না.
<br><br>
${error.message}
</div>
`;

}

}


// =====================================
// LOAD BOOKINGS
// =====================================

async function loadBookings(){

const box =
document.getElementById("bookings");

try{

const response =
await fetch(
API + "/api/admin/bookings?x=" +
Date.now()
);

const data =
await response.json();

if(!data.success){

throw new Error(
"Booking API failed"
);

}

const bookings =
data.bookings || [];


if(bookings.length === 0){

box.innerHTML =
"<div class='no-data'>No bookings found.</div>";

return;

}


box.className = "";

box.innerHTML = "";


bookings.forEach(function(booking){

const phone =
String(booking.phone || "")
.replace(/\D/g,"");


box.innerHTML += `

<div class="booking">

<div class="header-row">

<h3>
📅 Booking #${booking.id}
</h3>

<span class="status">
${booking.status || "Pending"}
</span>

</div>


<div class="info">

<b>Customer:</b>
${booking.customer_name || "-"}
<br>

<b>Phone:</b>
${booking.phone || "-"}


<div class="contact">

<button
class="call"
onclick="callCustomer('${phone}')">
📞 Call
</button>

<button
class="whatsapp"
onclick="bookingWhatsApp('${phone}','${booking.id}')">
💬 WhatsApp
</button>

</div>


<br>

<b>Booking Date:</b>
${booking.booking_date || "-"}

<br>

<b>Booking Time:</b>
${booking.booking_time || "-"}

<br>

<b>Guests:</b>
${booking.guests || "-"}

<br>

<b>Created:</b>
${booking.created_at || ""}

</div>


<select
id="bookingStatus${booking.id}">

<option value="Pending">🟡 Pending</option>

<option value="Confirmed">🔵 Confirmed</option>

<option value="Completed">🟢 Completed</option>

<option value="Cancelled">🔴 Cancelled</option>

</select>


<button
class="update"
onclick="updateBooking(${booking.id})">

✅ Update Booking Status

</button>


<div id="bookingResult${booking.id}">
</div>

</div>

`;

document.getElementById(
"bookingStatus" + booking.id
).value =
booking.status || "Pending";

});

}catch(error){

box.innerHTML = `
<div class="error">
❌ Bookings load হচ্ছে না.
<br><br>
${error.message}
</div>
`;

}

}


// =====================================
// LOAD MENU
// =====================================

async function loadMenu(){

const box =
document.getElementById("menuList");

box.innerHTML =
"⏳ Loading menu...";


try{

const response =
await fetch(
API + "/api/admin/menu?x=" +
Date.now()
);

const data =
await response.json();


if(!data.success){

throw new Error(
"Menu API failed"
);

}


const menu =
data.menu || [];


if(menu.length === 0){

box.innerHTML =
"<div class='no-data'>No menu items found.</div>";

return;

}


box.className = "";

box.innerHTML = "";


menu.forEach(function(item){

const availability =
Number(item.available) === 1;


let imageHTML = "";

if(item.image){

imageHTML = `
<img
class="menu-image"
src="${item.image}"
alt="${item.name}"
onerror="this.style.display='none'">
`;

}


box.innerHTML += `

<div class="menu-card">

${imageHTML}


<div class="header-row">

<h3>
${item.name}
</h3>

<span class="${
availability
? "available"
: "unavailable"
}">

${
availability
? "🟢 Available"
: "🔴 Unavailable"
}

</span>

</div>


<div class="info">

<b>Category:</b>
${item.category || "-"}

<br>

<b>Description:</b>
${item.description || "-"}

</div>


<div class="menu-price">

₹${Number(item.price).toFixed(0)}

</div>


<div class="menu-actions">

<button
class="edit"
onclick="editMenu(${item.id})">

✏️ Edit

</button>

<button
class="delete"
onclick="deleteMenu(${item.id})">

🗑️ Delete

</button>

</div>


<button
class="update"
onclick="toggleMenu(${item.id},${availability ? 0 : 1})">

${
availability
? "🔴 Make Unavailable"
: "🟢 Make Available"
}

</button>

</div>

`;

});

}catch(error){

box.innerHTML = `
<div class="error">
❌ Menu load হচ্ছে না.
<br><br>
${error.message}
</div>
`;

}

}


// =====================================
// SAVE MENU
// =====================================

async function saveMenu(){

const name =
document.getElementById("menuName")
.value.trim();

const category =
document.getElementById("menuCategory")
.value.trim();

const description =
document.getElementById("menuDescription")
.value.trim();

const price =
document.getElementById("menuPrice")
.value;

const image =
document.getElementById("menuImage")
.value.trim();

const available =
document.getElementById("menuAvailable")
.value;


const result =
document.getElementById(
"menuFormResult"
);


if(!name || price === ""){

result.innerHTML = `
<div class="error">
❌ Food name এবং price দিতে হবে।
</div>
`;

return;

}


const payload = {

name:name,

category:category,

description:description,

price:Number(price),

image:image,

available:Number(available)

};


try{

let response;


if(editingMenuId){

response =
await fetch(
API + "/api/admin/menu/" +
editingMenuId,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify(payload)

}
);

}else{

response =
await fetch(
API + "/api/admin/menu",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify(payload)

}
);

}


const data =
await response.json();


if(!response.ok ||
!data.success){

throw new Error(
data.message ||
"Menu save failed"
);

}


result.innerHTML = `
<div class="success">
✅ ${
editingMenuId
? "Food updated successfully"
: "Food added successfully"
}
</div>
`;


cancelEdit();

loadMenu();


}catch(error){

result.innerHTML = `
<div class="error">
❌ ${error.message}
</div>
`;

}

}


// =====================================
// EDIT MENU
// =====================================

async function editMenu(id){

try{

const response =
await fetch(
API + "/api/admin/menu?x=" +
Date.now()
);

const data =
await response.json();


const item =
(data.menu || [])
.find(function(menu){

return Number(menu.id) === Number(id);

});


if(!item){

alert(
"Menu item পাওয়া যায়নি"
);

return;

}


editingMenuId = id;


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Food";


document.getElementById(
"menuName"
).value =
item.name || "";


document.getElementById(
"menuCategory"
).value =
item.category || "";


document.getElementById(
"menuDescription"
).value =
item.description || "";


document.getElementById(
"menuPrice"
).value =
item.price || "";


document.getElementById(
"menuImage"
).value =
item.image || "";


document.getElementById(
"menuAvailable"
).value =
Number(item.available) === 1
? "1"
: "0";


document.getElementById(
"saveMenuBtn"
).textContent =
"💾 Update Food";


document.getElementById(
"cancelEditBtn"
).style.display =
"block";


window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});


}catch(error){

alert(
"Menu load করতে সমস্যা হয়েছে"
);

}

}


// =====================================
// CANCEL EDIT
// =====================================

function cancelEdit(){

editingMenuId = null;


document.getElementById(
"formTitle"
).textContent =
"➕ Add New Food";


document.getElementById(
"menuName"
).value = "";

document.getElementById(
"menuCategory"
).value = "";

document.getElementById(
"menuDescription"
).value = "";

document.getElementById(
"menuPrice"
).value = "";

document.getElementById(
"menuImage"
).value = "";

document.getElementById(
"menuAvailable"
).value = "1";


document.getElementById(
"saveMenuBtn"
).textContent =
"➕ Add Food";


document.getElementById(
"cancelEditBtn"
).style.display =
"none";

}


// =====================================
// DELETE MENU
// =====================================

async function deleteMenu(id){

if(!confirm(
"এই খাবারটি Delete করতে চান?"
)){

return;

}


try{

const response =
await fetch(
API + "/api/admin/menu/" + id,
{
method:"DELETE"
}
);


const data =
await response.json();


if(!response.ok ||
!data.success){

throw new Error(
data.message ||
"Delete failed"
);

}


alert(
"✅ Food deleted successfully"
);


loadMenu();


}catch(error){

alert(
"❌ " + error.message
);

}

}


// =====================================
// TOGGLE AVAILABLE
// =====================================

async function toggleMenu(
id,
available
){

try{

const response =
await fetch(
API + "/api/admin/menu/" + id,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify(
await getMenuData(
id,
available
)
)

}
);


const data =
await response.json();


if(!response.ok ||
!data.success){

throw new Error(
data.message ||
"Update failed"
);

}


loadMenu();


}catch(error){

alert(
"❌ " + error.message
);

}

}


// =====================================
// GET MENU DATA
// =====================================

async function getMenuData(
id,
available
){

const response =
await fetch(
API + "/api/admin/menu?x=" +
Date.now()
);

const data =
await response.json();


const item =
(data.menu || [])
.find(function(menu){

return Number(menu.id) === Number(id);

});


if(!item){

throw new Error(
"Menu item not found"
);

}


return {

name:item.name,

category:item.category || "",

description:item.description || "",

price:Number(item.price),

image:item.image || "",

available:Number(available)

};

}


// =====================================
// UPDATE ORDER
// =====================================

async function updateOrder(id){

const status =
document.getElementById(
"orderStatus" + id
).value;


const result =
document.getElementById(
"orderResult" + id
);


try{

const response =
await fetch(
API + "/api/admin/orders/" + id,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status:status
})

}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.message ||
"Update failed"
);

}


result.innerHTML = `
<div class="success">
✅ Order status updated:
<b>${status}</b>
</div>
`;


setTimeout(
loadOrders,
800
);


}catch(error){

result.innerHTML = `
<div class="error">
❌ ${error.message}
</div>
`;

}

}


// =====================================
// UPDATE BOOKING
// =====================================

async function updateBooking(id){

const status =
document.getElementById(
"bookingStatus" + id
).value;


const result =
document.getElementById(
"bookingResult" + id
);


try{

const response =
await fetch(
API + "/api/admin/bookings/" + id,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status:status
})

}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.message ||
"Update failed"
);

}


result.innerHTML = `
<div class="success">
✅ Booking status updated:
<b>${status}</b>
</div>
`;


setTimeout(
loadBookings,
800
);


}catch(error){

result.innerHTML = `
<div class="error">
❌ ${error.message}
</div>
`;

}

}


// =====================================
// CALL
// =====================================

function callCustomer(phone){

if(!phone){

alert(
"Phone number পাওয়া যায়নি"
);

return;

}

window.location.href =
"tel:" + phone;

}


// =====================================
// WHATSAPP ORDER
// =====================================

function sendWhatsApp(
phone,
orderId
){

if(!phone){

alert(
"Phone number পাওয়া যায়নি"
);

return;

}
