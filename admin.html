<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Choice Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh-btn {
      background: #2563eb;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-title {
      color: #666;
      font-size: 14px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .section {
      background: white;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      margin-top: 0;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f3f4f6;
    }

    .status {
      padding: 7px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .update-btn {
      background: #16a34a;
      color: white;
      margin-left: 5px;
    }

    .call-btn {
      background: #2563eb;
      color: white;
      margin: 3px;
    }

    .whatsapp-btn {
      background: #16a34a;
      color: white;
      margin: 3px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
    }

    .toggle-btn {
      background: #6366f1;
      color: white;
    }

    .menu-form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .menu-form input,
    .menu-form textarea,
    .menu-form select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .menu-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .save-btn {
      background: #2563eb;
      color: white;
    }

    .cancel-btn {
      background: #6b7280;
      color: white;
      margin-left: 5px;
    }

    .menu-image {
      width: 70px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .menu-form {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Your Choice Admin</h1>
  <button class="refresh-btn" onclick="loadAll()">⟳ Refresh All</button>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-title">Total Orders</div>
      <div class="stat-value" id="totalOrders">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Pending Orders</div>
      <div class="stat-value" id="pendingOrders">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Total Sales</div>
      <div class="stat-value" id="totalSales">₹0</div>
    </div>
  </div>

  <!-- ORDERS -->
  <div class="section">
    <h2>🛒 Customer Orders</h2>

    <div id="ordersMessage"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="ordersBody">
          <tr>
            <td colspan="7" class="loading">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- BOOKINGS -->
  <div class="section">
    <h2>📅 Table Bookings</h2>

    <div id="bookingsMessage"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Date</th>
            <th>Time</th>
            <th>Guests</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="bookingsBody">
          <tr>
            <td colspan="8" class="loading">Loading bookings...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MENU MANAGEMENT -->
  <div class="section">
    <h2>🍽️ Menu Management</h2>

    <div id="menuMessage"></div>

    <form id="menuForm" class="menu-form">

      <input type="hidden" id="menuId">

      <input
        type="text"
        id="menuName"
        placeholder="Menu Name"
        required
      >

      <input
        type="text"
        id="menuCategory"
        placeholder="Category"
      >

      <input
        type="number"
        id="menuPrice"
        placeholder="Price"
        min="0"
        step="0.01"
        required
      >

      <input
        type="text"
        id="menuImage"
        placeholder="Image path e.g. images/chicken-biryani.jpg"
      >

      <textarea
        id="menuDescription"
        class="full"
        placeholder="Description"
      ></textarea>

      <select id="menuAvailable">
        <option value="1">Available</option>
        <option value="0">Not Available</option>
      </select>

      <div>
        <button type="submit" class="save-btn" id="saveMenuButton">
          ➕ Add Menu
        </button>

        <button
          type="button"
          class="cancel-btn"
          id="cancelEditButton"
          onclick="cancelEdit()"
          style="display:none;"
        >
          Cancel
        </button>
      </div>

    </form>
  </div>

  <!-- CURRENT MENU -->
  <div class="section">
    <h2>📋 Current Menu</h2>

    <div id="currentMenu">
      <div class="loading">Loading menu...</div>
    </div>
  </div>

</div>

<script>

  /* ================================
     API
  ================================= */

  const API = "https://1251file.xboy7334.workers.dev";


  /* ================================
     HELPERS
  ================================= */

  function escapeHTML(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showMessage(id, message, type) {
    const box = document.getElementById(id);

    if (!box) {
      return;
    }

    box.innerHTML =
      '<div class="' + type + '">' +
      escapeHTML(message) +
      '</div>';
  }


  function clearMessage(id) {
    const box = document.getElementById(id);

    if (box) {
      box.innerHTML = "";
    }
  }


  async function apiFetch(path, options) {

    const response = await fetch(API + path, options);

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch (error) {
      throw new Error(
        "Server থেকে সঠিক JSON response পাওয়া যায়নি। HTTP " +
        response.status
      );
    }

    if (!response.ok || data.success === false) {
      throw new Error(
        data.message || ("HTTP Error " + response.status)
      );
    }

    return data;
  }


  /* ================================
     LOAD ALL
  ================================= */

  async function loadAll() {

    clearMessage("ordersMessage");
    clearMessage("bookingsMessage");
    clearMessage("menuMessage");

    await Promise.all([
      loadOrders(),
      loadBookings(),
      loadMenu()
    ]);
  }


  /* ================================
     ORDERS
  ================================= */

  async function loadOrders() {

    const body = document.getElementById("ordersBody");

    body.innerHTML =
      '<tr>' +
      '<td colspan="7" class="loading">Loading orders...</td>' +
      '</tr>';

    try {

      const data = await apiFetch("/api/admin/orders");

      const orders = Array.isArray(data.orders)
        ? data.orders
        : [];

      document.getElementById("totalOrders").textContent =
        orders.length;

      let pending = 0;
      let sales = 0;

      for (const order of orders) {

        if (order.status === "Pending") {
          pending++;
        }

        sales += Number(order.total_amount || 0);
      }

      document.getElementById("pendingOrders").textContent =
        pending;

      document.getElementById("totalSales").textContent =
        "₹" + sales.toFixed(0);


      if (orders.length === 0) {

        body.innerHTML =
          '<tr>' +
          '<td colspan="7" class="loading">কোনো Order নেই</td>' +
          '</tr>';

        return;
      }


      body.innerHTML = "";

      orders.forEach(function(order) {

        let itemsHTML = "";

        if (Array.isArray(order.items)) {

          order.items.forEach(function(item) {

            itemsHTML +=
              escapeHTML(item.item_name) +
              " × " +
              escapeHTML(item.quantity) +
              " ₹" +
              Number(item.price || 0).toFixed(0) +
              "<br>";

          });

        }


        const row = document.createElement("tr");

        row.innerHTML =
          "<td><b>#" +
          escapeHTML(order.id) +
          "</b><br><small>" +
          escapeHTML(order.created_at || "") +
          "</small></td>" +

          "<td>" +
          "<b>" +
          escapeHTML(order.customer_name) +
          "</b><br>" +
          escapeHTML(order.phone) +
          "<br>" +
          escapeHTML(order.address || "") +
          "<br>" +

          '<button class="call-btn" onclick="callCustomer(\'' +
          escapeHTML(order.phone) +
          "')\">📞 Call</button>" +

          '<button class="whatsapp-btn" onclick="sendWhatsApp(\'' +
          escapeHTML(order.phone) +
          "','" +
          escapeHTML(order.customer_name) +
          "')\">WhatsApp</button>" +

          "</td>" +

          "<td>" +
          itemsHTML +
          "</td>" +

          "<td><b>₹" +
          Number(order.total_amount || 0).toFixed(0) +
          "</b></td>" +

          "<td>" +
          escapeHTML(order.payment_method || "COD") +
          "</td>" +

          "<td>" +
          '<select class="status" id="orderStatus' +
          order.id +
          '">' +

          statusOption("Pending", order.status) +
          statusOption("Confirmed", order.status) +
          statusOption("Preparing", order.status) +
          statusOption("Delivered", order.status) +
          statusOption("Cancelled", order.status) +

          "</select>" +
          "</td>" +

          "<td>" +

          '<button class="update-btn" onclick="updateOrder(' +
          order.id +
          ')">' +
          "Update" +
          "</button>" +

          "</td>";

        body.appendChild(row);

      });

    } catch (error) {

      body.innerHTML =
        '<tr>' +
        '<td colspan="7" class="error">' +
        escapeHTML(error.message) +
        "</td>" +
        "</tr>";

      showMessage(
        "ordersMessage",
        error.message,
        "error"
      );
    }
  }


  function statusOption(value, selected) {

    return (
      '<option value="' +
      value +
      '"' +
      (value === selected ? " selected" : "") +
      ">" +
      value +
      "</option>"
    );
  }


  async function updateOrder(id) {

    const select =
      document.getElementById("orderStatus" + id);

    const status = select.value;

    try {

      await apiFetch(
        "/api/admin/orders/" + id,
        {
          method: "PATCH",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            status: status
          })
        }
      );

      alert("Order status updated");

      loadOrders();

    } catch (error) {

      alert("Error: " + error.message);

    }
  }


  /* ================================
     BOOKINGS
  ================================= */

  async function loadBookings() {

    const body = document.getElementById("bookingsBody");

    body.innerHTML =
      '<tr>' +
      '<td colspan="8" class="loading">Loading bookings...</td>' +
      '</tr>';

    try {

      const data =
        await apiFetch("/api/admin/bookings");

      const bookings =
        Array.isArray(data.bookings)
          ? data.bookings
          : [];


      if (bookings.length === 0) {

        body.innerHTML =
          '<tr>' +
          '<td colspan="8" class="loading">' +
          "কোনো Table Booking নেই" +
          "</td>" +
          "</tr>";

        return;
      }


      body.innerHTML = "";


      bookings.forEach(function(booking) {

        const row = document.createElement("tr");

        row.innerHTML =

          "<td>#" +
          escapeHTML(booking.id) +
          "</td>" +

          "<td>" +
          escapeHTML(booking.customer_name) +
          "</td>" +

          "<td>" +
          escapeHTML(booking.phone) +
          "<br>" +

          '<button class="call-btn" onclick="callCustomer(\'' +
          escapeHTML(booking.phone) +
          "')\">📞 Call</button>" +

          '<button class="whatsapp-btn" onclick="bookingWhatsApp(\'' +
          escapeHTML(booking.phone) +
          "','" +
          escapeHTML(booking.customer_name) +
          "')\">WhatsApp</button>" +

          "</td>" +

          "<td>" +
          escapeHTML(booking.booking_date) +
          "</td>" +

          "<td>" +
          escapeHTML(booking.booking_time) +
          "</td>" +

          "<td>" +
          escapeHTML(booking.guests) +
          "</td>" +

          "<td>" +

          '<select class="status" id="bookingStatus' +
          booking.id +
          '">' +

          bookingStatusOption(
            "Pending",
            booking.status
          ) +

          bookingStatusOption(
            "Confirmed",
            booking.status
          ) +

          bookingStatusOption(
            "Completed",
            booking.status
          ) +

          bookingStatusOption(
            "Cancelled",
            booking.status
          ) +

          "</select>" +

          "</td>" +

          "<td>" +

          '<button class="update-btn" onclick="updateBooking(' +
          booking.id +
          ')">' +
          "Update" +
          "</button>" +

          "</td>";

        body.appendChild(row);

      });

    } catch (error) {

      body.innerHTML =
        '<tr>' +
        '<td colspan="8" class="error">' +
        escapeHTML(error.message) +
        "</td>" +
        "</tr>";

      showMessage(
        "bookingsMessage",
        error.message,
        "error"
      );
    }
  }


  function bookingStatusOption(value, selected) {

    return (
      '<option value="' +
      value +
      '"' +
      (value === selected ? " selected" : "") +
      ">" +
      value +
      "</option>"
    );
  }


  async function updateBooking(id) {

    const select =
      document.getElementById("bookingStatus" + id);

    const status = select.value;

    try {

      await apiFetch(
        "/api/admin/bookings/" + id,
        {
          method: "PATCH",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            status: status
          })
        }
      );

      alert("Booking status updated");

      loadBookings();

    } catch (error) {

      alert("Error: " + error.message);

    }
  }


  /* ================================
     MENU
  ================================= */

  async function loadMenu() {

    const container =
      document.getElementById("currentMenu");

    container.innerHTML =
      '<div class="loading">Loading menu...</div>';


    try {

      const data =
        await apiFetch("/api/admin/menu");

      const menu =
        Array.isArray(data.menu)
          ? data.menu
          : [];


      if (menu.length === 0) {

        container.innerHTML =
          '<div class="loading">' +
          "কোনো Menu Item নেই" +
          "</div>";

        return;
      }


      let html =
        '<div class="table-wrap">' +
        "<table>" +

        "<thead>" +
        "<tr>" +
        "<th>ID</th>" +
        "<th>Image</th>" +
        "<th>Name</th>" +
        "<th>Category</th>" +
        "<th>Price</th>" +
        "<th>Available</th>" +
        "<th>Action</th>" +
        "</tr>" +
        "</thead>" +

        "<tbody>";


      menu.forEach(function(item) {

        const image =
          item.image
            ? '<img class="menu-image" src="' +
              escapeHTML(item.image) +
              '" onerror="this.style.display=\'none\'">'
            : "No Image";


        html +=
          "<tr>" +

          "<td>#" +
          escapeHTML(item.id) +
          "</td>" +

          "<td>" +
          image +
          "</td>" +

          "<td>" +
          "<b>" +
          escapeHTML(item.name) +
          "</b>" +

          "<br><small>" +
          escapeHTML(item.description || "") +
          "</small>" +

          "</td>" +

          "<td>" +
          escapeHTML(item.category || "") +
          "</td>" +

          "<td><b>₹" +
          Number(item.price || 0).toFixed(0) +
          "</b></td>" +

          "<td>" +
          (Number(item.available) === 1
            ? "✅ Available"
            : "❌ Hidden") +
          "</td>" +

          "<td>" +

          '<button class="edit-btn" onclick="editMenu(' +
          item.id +
          ')">' +
          "Edit" +
          "</button> " +

          '<button class="toggle-btn" onclick="toggleMenu(' +
          item.id +
          "," +
          Number(item.available) +
          ')">' +

          (
            Number(item.available) === 1
              ? "Hide"
              : "Show"
          ) +

          "</button> " +

          '<button class="delete-btn" onclick="deleteMenu(' +
          item.id +
          ')">' +
          "Delete" +
          "</button>" +

          "</td>" +

          "</tr>";

      });


      html +=
        "</tbody>" +
        "</table>" +
        "</div>";


      container.innerHTML = html;


    } catch (error) {

      container.innerHTML =
        '<div class="error">' +
        escapeHTML(error.message) +
        "</div>";

      showMessage(
        "menuMessage",
        error.message,
        "error"
      );
    }
  }


  /* ================================
     ADD / EDIT MENU
  ================================= */

  document
    .getElementById("m
