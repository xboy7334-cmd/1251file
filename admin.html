<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Your Choice Family Restaurant</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
}

.header{
  background:#111827;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  margin:0;
  font-size:22px;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  padding:18px;
  border-radius:10px;
  background:#f1f5f9;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:5px;
}

button{
  border:0;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.order{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-top:15px;
}

.order-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order h3{
  margin:0;
}

.customer{
  margin:10px 0;
  line-height:1.6;
}

.items{
  background:#f8fafc;
  padding:10px;
  border-radius:8px;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.total{
  font-size:18px;
  font-weight:bold;
  margin-top:12px;
}

.status{
  background:#f59e0b;
  color:white;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#666;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .header{
    gap:10px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>🍽️ Your Choice Admin</h1>
  <button onclick="loadOrders()">Refresh Orders</button>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      Total Orders
