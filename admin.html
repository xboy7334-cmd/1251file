<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Choice Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

.header h1{
    margin:0 0 12px;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:15px;
}

button{
    border:0;
    cursor:pointer;
    padding:11px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.refresh{
    background:#2563eb;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px #ddd;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.order{
    background:white;
    margin-bottom:18px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px #ddd;
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.order h3{
    margin:0;
}

.customer{
    line-height:1.7;
    margin-top:12px;
}

.contact-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.call-btn{
    background:#2563eb;
    color:white;
}

.whatsapp-btn{
    background:#16a34a;
    color:white;
}

.items{
    background:#f9fafb;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
}

.item{
    padding:8px 0;
    border-bottom:1px solid #ddd;
}

.item:last-child{
    border-bottom:0;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:14px;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    background:#f59e0b;
    color:white;
}

.status-box{
    margin-top:15px;
    padding:14px;
    background:#f8fafc;
    border-radius:10px;
}

.status-box label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

.status-select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    background:white;
}

.update-btn{
    margin-top:10px;
    background:#16a34a;
    color:white;
    width:100%;
}

.update-btn:disabled{
    background:#999;
}

.success{
    margin-top:10px;
    padding:10px;
    background:#dcfce7;
    color:#166534;
    border-radius:8px;
}

.error{
    margin-top:10px;
    padding:10px;
    background:#fee2e2;
    color:#991b1b;
    border-radius:8px;
}

.loading{
    text-align:center;
    padding:20px;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .contact-buttons{
        flex-direction:column;
    }

    .contact-buttons button{
        width:100%;
    }

    .container{
        padding:10px;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>🍽️ Your Choice Admin</h1>

    <button
        class="refresh"
        onclick="loadOrders()">
        🔄 Refresh Orders
    </button>

</div>


<div class="container">

    <div class="stats">

        <div class="stat">
            Total Orders
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            Pending Orders
            <strong id="pendingOrders">0</strong>
        </div>

        <div class="stat">
            Total Sales
            <strong>
                ₹<span id="totalSales">0</span>
            </strong>
        </div>

    </div>


    <div id="message" class="loading">
        ⏳ Loading orders...
    </div>


    <div id="orders"></div>

</div>


<script>

const API =
"https://1251file.xboy7334.workers.dev/api/admin/orders";


// ========================================
// LOAD ORDERS
// ========================================

async function loadOrders(){

    const message =
        document.getElementById("message");

    const ordersBox =
        document.getElementById("orders");

    message.className = "loading";

    message.innerHTML =
        "⏳ Loading orders...";

    ordersBox.innerHTML = "";


    try{

        const response = await fetch(API,{
            method:"GET",
            cache:"no-store"
        });


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message || "API error"
            );
        }


        const orders =
            data.orders || [];


        document.getElementById(
            "totalOrders"
        ).textContent = orders.length;


        let pending = 0;
        let sales = 0;


        orders.forEach(function(order){

            if(order.status === "Pending"){
                pending++;
            }

            sales += Number(
                order.total_amount || 0
            );

        });


        document.getElementById(
            "pendingOrders"
        ).textContent = pending;


        document.getElementById(
            "totalSales"
        ).textContent =
            sales.toFixed(0);


        message.innerHTML = "";


        if(orders.length === 0){

            ordersBox.innerHTML = `
                <div class="order">
                    No orders found.
                </div>
            `;

            return;
        }


        orders.forEach(function(order){

            let itemsHTML = "";


            (order.items || [])
            .forEach(function(item){

                const itemTotal =
                    Number(item.price) *
                    Number(item.quantity);


                itemsHTML += `

                    <div class="item">

                        ${item.item_name}
                        × ${item.quantity}

                        — ₹${itemTotal}

                    </div>

                `;

            });


            const currentStatus =
                order.status || "Pending";


            // Clean phone number for WhatsApp
            const phone =
                String(order.phone || "")
                .replace(/\D/g,"");


            const html = `

                <div class="order">

                    <div class="order-header">

                        <h3>
                            📦 Order #${order.id}
                        </h3>

                        <span class="status">
                            ${currentStatus}
                        </span>

                    </div>


                    <div class="customer">

                        <b>Customer:</b>
                        ${order.customer_name || "-"}
                        <br>

                        <b>Phone:</b>
                        ${order.phone || "-"}

                        <div class="contact-buttons">

                            <button
                                class="call-btn"
                                onclick="callCustomer('${phone}')"
                            >
                                📞 Call Customer
                            </button>


                            <button
                                class="whatsapp-btn"
                                onclick="whatsappCustomer('${phone}','${order.id}')"
                            >
                                💬 WhatsApp
                            </button>

                        </div>


                        <br>

                        <b>Address:</b>
                        ${order.address || "-"}

                        <br>

                        <b>Payment:</b>
                        ${order.payment_method || "COD"}

                        <br>

                        <b>Date:</b>
                        ${order.created_at || ""}

                    </div>


                    <div class="items">

                        <b>Items</b>

                        ${itemsHTML}

                    </div>


                    <div class="total">

                        Total:
                        ₹${order.total_amount}

                    </div>


                    <!-- STATUS -->

                    <div class="status-box">

                        <label>
                            Change Order Status
                        </label>


                        <select
                            class="status-select"
                            id="status-${order.id}"
                        >

                            <option
                                value="Pending"
                                ${currentStatus === "Pending" ? "selected" : ""}
                            >
                                🟡 Pending
                            </option>


                            <option
                                value="Confirmed"
                                ${currentStatus === "Confirmed" ? "selected" : ""}
                            >
                                🔵 Confirmed
                            </option>


                            <option
                                value="Preparing"
                                ${currentStatus === "Preparing" ? "selected" : ""}
                            >
                                🟠 Preparing
                            </option>


                            <option
                                value="Delivered"
                                ${currentStatus === "Delivered" ? "selected" : ""}
                            >
                                🟢 Delivered
                            </option>


                            <option
                                value="Cancelled"
                                ${currentStatus === "Cancelled" ? "selected" : ""}
                            >
                                🔴 Cancelled
                            </option>

                        </select>


                        <button
                            class="update-btn"
                            id="update-${order.id}"
                            onclick="updateStatus(${order.id})"
                        >
                            ✅ Update Status
                        </button>


                        <div
                            id="result-${order.id}"
                        ></div>

                    </div>

                </div>

            `;


            ordersBox.innerHTML += html;

        });


    }catch(error){

        console.error(error);


        message.className = "error";


        message.innerHTML = `
            ❌ Orders load হচ্ছে না.
            <br><br>
            ${error.message}
        `;

    }

}


// ========================================
// CALL CUSTOMER
// ========================================

function callCustomer(phone){

    if(!phone){

        alert("Phone number পাওয়া যায়নি");

        return;
    }


    window.location.href =
        "tel:" + phone;

}


// ========================================
// WHATSAPP CUSTOMER
// ========================================

function whatsappCustomer(phone, orderId){

    if(!phone){

        alert("Phone number পাওয়া যায়নি");

        return;
    }


    const message =
        "Hello, this is Your Choice Family Restaurant regarding your Order #" +
        orderId +
        ".";


    const whatsappURL =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );

}


// ========================================
// UPDATE STATUS
// ========================================

async function updateStatus(orderId){

    const select =
        document.getElementById(
            "status-" + orderId
        );


    const button =
        document.getElementById(
            "update-" + orderId
        );


    const result =
        document.getElementById(
            "result-" + orderId
        );


    const newStatus =
        select.value;


    button.disabled = true;

    button.textContent =
        "⏳ Updating...";


    result.innerHTML = "";


    try{

        const response =
            await fetch(
                API + "/" + orderId,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        status:newStatus
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Status update failed"
            );
        }


        result.innerHTML = `
            <div class="success">
                ✅ Order #${orderId}
                status updated to
                <b>${newStatus}</b>
            </div>
        `;


        button.textContent =
            "✅ Updated";


        setTimeout(function(){

            loadOrders();

        },1000);


    }catch(error){

        console.error(error);


        result.innerHTML = `
            <div class="error">
                ❌ ${error.message}
            </div>
        `;


        button.disabled = false;

        button.textContent =
            "✅ Update Status";

    }

}


// ========================================
// START
// ========================================

loadOrders();

</script>

</body>
</html>
