<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Choice Admin Test</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.box{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

button{
  background:#2563eb;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:7px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#result{
  margin-top:20px;
  padding:15px;
  background:#f3f4f6;
  border-radius:8px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
}

.success{
  background:#dcfce7 !important;
  color:#166534;
}

.error{
  background:#fee2e2 !important;
  color:#991b1b;
}

.order{
  background:#f9fafb;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-top:10px;
}

.menu{
  background:#f9fafb;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-top:10px;
}

.loading{
  color:#666;
}

</style>
</head>


<body>


<header>
  Your Choice Admin
</header>


<div class="container">


  <!-- API TEST -->

  <div class="box">

    <h2>🔧 API Test</h2>

    <p>
      প্রথমে এই Button চাপুন।
    </p>

    <button onclick="testAPI()">
      Test Order API
    </button>

    <div id="result">
      JavaScript প্রস্তুত আছে।
    </div>

  </div>


  <!-- ORDERS -->

  <div class="box">

    <h2>🛒 Orders</h2>

    <div id="orders">
      এখনো Load করা হয়নি।
    </div>

  </div>


  <!-- MENU -->

  <div class="box">

    <h2>🍽️ Menu</h2>

    <div id="menu">
      এখনো Load করা হয়নি।
    </div>

  </div>


</div>


<script>


/* =====================================
   API ADDRESS
===================================== */

const API =
  "https://1251file.xboy7334.workers.dev";


/* =====================================
   TEST API
===================================== */

async function testAPI(){

  const result =
    document.getElementById("result");


  result.className = "";

  result.innerHTML =
    "⏳ JavaScript চলছে...\n\n" +
    "Order API পরীক্ষা করছি...";


  try{

    const response =
      await fetch(
        API + "/api/admin/orders"
      );


    const text =
      await response.text();


    if(response.ok){

      result.className =
        "success";

      result.innerHTML =
        "✅ JavaScript চলছে\n\n" +

        "HTTP Status: " +
        response.status +

        "\n\n" +

        "Server Response:\n" +

        text;


      /* Orders-ও Load করি */

      loadOrders();


    }else{

      result.className =
        "error";

      result.innerHTML =
        "❌ API Error\n\n" +

        "HTTP Status: " +
        response.status +

        "\n\n" +

        text;

    }


  }catch(error){

    result.className =
      "error";

    result.innerHTML =
      "❌ Connection Error\n\n" +

      error.message;

  }

}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders(){

  const box =
    document.getElementById("orders");


  box.innerHTML =
    '<div class="loading">' +
    '⏳ Orders Loading...' +
    '</div>';


  try{

    const response =
      await fetch(
        API + "/api/admin/orders"
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];


    if(orders.length === 0){

      box.innerHTML =
        "কোনো Order পাওয়া যায়নি।";

      return;

    }


    box.innerHTML = "";


    orders.forEach(function(order){

      const div =
        document.createElement("div");


      div.className =
        "order";


      let items = "";


      if(
        Array.isArray(order.items)
      ){

        order.items.forEach(
          function(item){

            items +=
              item.item_name +
              " × " +
              item.quantity +
              " — ₹" +
              item.price +
              "<br>";

          }
        );

      }


      div.innerHTML =

        "<b>Order #" +
        order.id +
        "</b>" +

        "<br><br>" +

        "<b>Customer:</b> " +
        (order.customer_name || "") +

        "<br>" +

        "<b>Phone:</b> " +
        (order.phone || "") +

        "<br>" +

        "<b>Address:</b> " +
        (order.address || "") +

        "<br><br>" +

        "<b>Items:</b><br>" +
        items +

        "<br>" +

        "<b>Total:</b> ₹" +
        (order.total_amount || 0) +

        "<br>" +

        "<b>Payment:</b> " +
        (order.payment_method || "COD") +

        "<br>" +

        "<b>Status:</b> " +
        (order.status || "Pending");


      box.appendChild(div);

    });


  }catch(error){

    box.innerHTML =
      '<div class="error">' +
      "Order Error: " +
      error.message +
      "</div>";

  }

}


/* =====================================
   LOAD MENU
===================================== */

async function loadMenu(){

  const box =
    document.getElementById("menu");


  box.innerHTML =
    '<div class="loading">' +
    '⏳ Menu Loading...' +
    '</div>';


  try{

    const response =
      await fetch(
        API + "/api/admin/menu"
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const menu =
      Array.isArray(data.menu)
        ? data.menu
        : [];


    if(menu.length === 0){

      box.innerHTML =
        "কোনো Menu পাওয়া যায়নি।";

      return;

    }


    box.innerHTML = "";


    menu.forEach(function(item){

      const div =
        document.createElement("div");


      div.className =
        "menu";


      div.innerHTML =

        "<b>" +
        item.name +
        "</b>" +

        "<br>" +

        "Category: " +
        (item.category || "") +

        "<br>" +

        "Price: ₹" +
        (item.price || 0) +

        "<br>" +

        "Available: " +

        (
          Number(item.available) === 1
            ? "✅ Yes"
            : "❌ No"
        );


      box.appendChild(div);

    });


  }catch(error){

    box.innerHTML =
      '<div class="error">' +
      "Menu Error: " +
      error.message +
      "</div>";

  }

}


/* =====================================
   PAGE LOAD
===================================== */

window.addEventListener(
  "load",
  function(){

    /*
      এখানে ইচ্ছা করে
      API auto-load করছি না।

      প্রথমে Button চাপ দিয়ে
      JavaScript + API test হবে।
    */

    console.log(
      "Your Choice Admin JavaScript চলছে"
    );

  }
);


</script>


</body>
</html>
