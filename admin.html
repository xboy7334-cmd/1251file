<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Choice Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:20px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 13px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  background:#2563eb;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
  color:#666;
  font-size:13px;
}

.card-value{
  font-size:27px;
  font-weight:bold;
  margin-top:7px;
}

.section{
  background:white;
  padding:15px;
  margin-bottom:18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
  margin-top:0;
  font-size:19px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:750px;
  border-collapse:collapse;
}

th,
td{
  padding:9px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f3f4f6;
}

.loading{
  text-align:center;
  padding:20px;
  color:#666;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:10px;
  border-radius:7px;
  margin-bottom:10px;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:10px;
  border-radius:7px;
  margin-bottom:10px;
}

select,
input,
textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.full{
  grid-column:1 / -1;
}

.add{
  background:#2563eb;
  color:white;
}

.update{
  background:#16a34a;
  color:white;
}

.delete{
  background:#dc2626;
  color:white;
}

.edit{
  background:#f59e0b;
  color:white;
}

.hide{
  background:#6366f1;
  color:white;
}

.call{
  background:#2563eb;
  color:white;
  margin-top:4px;
}

.whatsapp{
  background:#16a34a;
  color:white;
  margin-top:4px;
}

.menu-image{
  width:70px;
  height:55px;
  object-fit:cover;
  border-radius:6px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  header{
    gap:10px;
  }

}

</style>
</head>

<script>

/* =================================
   API
================================= */

const API =
"https://1251file.xboy7334.workers.dev";


let menuData = [];


/* =================================
   HTML ESCAPE
================================= */

function esc(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================
   API REQUEST
================================= */

async function api(url,options){

  const response =
    await fetch(
      API + url,
      options || {}
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }catch(e){

    throw new Error(
      "API response JSON নয়। HTTP " +
      response.status
    );

  }


  if(!response.ok){

    throw new Error(
      data.message ||
      "HTTP Error " +
      response.status
    );

  }


  return data;

}


/* =================================
   LOAD ALL
================================= */

async function loadAll(){

  await loadOrders();

  await loadBookings();

  await loadMenu();

}


/* =================================
   ORDERS
================================= */

async function loadOrders(){

  const body =
    document.getElementById(
      "ordersBody"
    );


  body.innerHTML =
    '<tr><td colspan="7" class="loading">' +
    'Loading orders...' +
    '</td></tr>';


  try{

    const data =
      await api(
        "/api/admin/orders"
      );


    const orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];


    document.getElementById(
      "totalOrders"
    ).textContent =
      orders.length;


    let pending = 0;

    let sales = 0;


    orders.forEach(function(order){

      if(order.status === "Pending"){

        pending++;

      }


      sales +=
        Number(
          order.total_amount || 0
        );

    });


    document.getElementById(
      "pendingOrders"
    ).textContent =
      pending;


    document.getElementById(
      "totalSales"
    ).textContent =
      "₹" + sales.toFixed(0);


    if(orders.length === 0){

      body.innerHTML =
        '<tr>' +
        '<td colspan="7" class="loading">' +
        'কোনো Order নেই' +
        '</td>' +
        '</tr>';

      return;

    }


    body.innerHTML = "";


    orders.forEach(function(order){

      let items = "";


      if(Array.isArray(order.items)){

        order.items.forEach(function(item){

          items +=
            esc(item.item_name) +
            " × " +
            esc(item.quantity) +
            " ₹" +
            Number(
              item.price || 0
            ).toFixed(0) +
            "<br>";

        });

      }


      const row =
        document.createElement("tr");


      row.innerHTML =

        "<td>" +

        "<b>#" +
        esc(order.id) +
        "</b>" +

        "<br>" +

        "<small>" +
        esc(order.created_at || "") +
        "</small>" +

        "</td>" +


        "<td>" +

        "<b>" +
        esc(
          order.customer_name || ""
        ) +
        "</b>" +

        "<br>" +

        esc(order.phone || "") +

        "<br>" +

        esc(order.address || "") +

        "<br>" +

        '<button class="call" ' +
        'onclick="callCustomer(\'' +
        esc(order.phone || "") +
        '\')">' +
        '📞 Call' +
        '</button>' +

        '<button class="whatsapp" ' +
        'onclick="whatsappCustomer(\'' +
        esc(order.phone || "") +
        '\',\'' +
        esc(order.customer_name || "") +
        '\')">' +
        'WhatsApp' +
        '</button>' +

        "</td>" +


        "<td>" +
        items +
        "</td>" +


        "<td>" +

        "<b>₹" +
        Number(
          order.total_amount || 0
        ).toFixed(0) +
        "</b>" +

        "</td>" +


        "<td>" +

        esc(
          order.payment_method ||
          "COD"
        ) +

        "</td>" +


        "<td>" +

        '<select id="orderStatus_' +
        order.id +
        '">' +

        option(
          "Pending",
          order.status
        ) +

        option(
          "Confirmed",
          order.status
        ) +

        option(
          "Preparing",
          order.status
        ) +

        option(
          "Delivered",
          order.status
        ) +

        option(
          "Cancelled",
          order.status
        ) +

        "</select>" +

        "</td>" +


        "<td>" +

        '<button class="update" ' +
        'onclick="updateOrder(' +
        order.id +
        ')">' +
        'Update' +
        '</button>' +

        "</td>";


      body.appendChild(row);

    });


  }catch(error){

    body.innerHTML =
      '<tr>' +
      '<td colspan="7" class="error">' +
      esc(
        "Order Error: " +
        error.message
      ) +
      '</td>' +
      '</tr>';

  }

}


/* =================================
   OPTION
================================= */

function option(value,selected){

  return (
    '<option value="' +
    value +
    '"' +
    (
      value === selected
        ? " selected"
        : ""
    ) +
    ">" +
    value +
    "</option>"
  );

}


/* =================================
   UPDATE ORDER
================================= */

async function updateOrder(id){

  const select =
    document.getElementById(
      "orderStatus_" + id
    );


  try{

    await api(
      "/api/admin/orders/" + id,
      {

        method:"PATCH",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          status:
            select.value

        })

      }
    );


    alert(
      "Order status updated."
    );


    await loadOrders();


  }catch(error){

    alert(
      "Error: " +
      error.message
    );

  }

}


/* =================================
   BOOKINGS
================================= */

async function loadBookings(){

  const body =
    document.getElementById(
      "bookingsBody"
    );


  body.innerHTML =
    '<tr><td colspan="8" class="loading">' +
    'Loading bookings...' +
    '</td></tr>';


  try{

    const data =
      await api(
        "/api/admin/bookings"
      );


    const bookings =
      Array.isArray(data.bookings)
        ? data.bookings
        : [];


    if(bookings.length === 0){

      body.innerHTML =
        '<tr>' +
        '<td colspan="8" class="loading">' +
        'কোনো Table Booking নেই' +
        '</td>' +
        '</tr>';

      return;

    }


    body.innerHTML = "";


    bookings.forEach(function(booking){

      const row =
        document.createElement("tr");


      row.innerHTML =

        "<td>#" +
        esc(booking.id) +
        "</td>" +


        "<td>" +
        esc(
          booking.customer_name || ""
        ) +
        "</td>" +


        "<td>" +

        esc(
          booking.phone || ""
        ) +

        "<br>" +

        '<button class="call" ' +
        'onclick="callCustomer(\'' +
        esc(booking.phone || "") +
        '\')">' +
        '📞 Call' +
        '</button>' +

        '<button class="whatsapp" ' +
        'onclick="whatsappCustomer(\'' +
        esc(booking.phone || "") +
        '\',\'' +
        esc(booking.customer_name || "") +
        '\')">' +
        'WhatsApp' +
        '</button>' +

        "</td>" +


        "<td>" +
        esc(
          booking.booking_date || ""
        ) +
        "</td>" +


        "<td>" +
        esc(
          booking.booking_time || ""
        ) +
        "</td>" +


        "<td>" +
        esc(
          booking.guests || ""
        ) +
        "</td>" +


        "<td>" +

        '<select id="bookingStatus_' +
        booking.id +
        '">' +

        option(
          "Pending",
          booking.status
        ) +

        option(
          "Confirmed",
          booking.status
        ) +

        option(
          "Completed",
          booking.status
        ) +

        option(
          "Cancelled",
          booking.status
        ) +

        "</select>" +

        "</td>" +


        "<td>" +

        '<button class="update" ' +
        'onclick="updateBooking(' +
        booking.id +
        ')">' +
        'Update' +
        '</button>' +

        "</td>";


      body.appendChild(row);

    });


  }catch(error){

    body.innerHTML =
      '<tr>' +
      '<td colspan="8" class="error">' +
      esc(
        "Booking Error: " +
        error.message
      ) +
      '</td>' +
      '</tr>';

  }

}


/* =================================
   UPDATE BOOKING
================================= */

async function updateBooking(id){

  const select =
    document.getElementById(
      "bookingStatus_" + id
    );


  try{

    await api(
      "/api/admin/bookings/" + id,
      {

        method:"PATCH",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          status:
            select.value

        })

      }
    );


    alert(
      "Booking status updated."
    );


    await loadBookings();


  }catch(error){

    alert(
      "Error: " +
      error.message
    );

/* =================================
   MENU
================================= */

async function loadMenu(){

  const box =
    document.getElementById(
      "currentMenu"
    );


  box.innerHTML =
    '<div class="loading">' +
    'Loading menu...' +
    '</div>';


  try{

    const data =
      await api(
        "/api/admin/menu"
      );


    menuData =
      Array.isArray(data.menu)
        ? data.menu
        : [];


    if(menuData.length === 0){

      box.innerHTML =
        '<div class="loading">' +
        'কোনো Menu নেই' +
        '</div>';

      return;

    }


    let html =

      '<div class="table-wrap">' +

      '<table>' +

      '<thead>' +

      '<tr>' +

      '<th>ID</th>' +
      '<th>Image</th>' +
      '<th>Name</th>' +
      '<th>Category</th>' +
      '<th>Price</th>' +
      '<th>Available</th>' +
      '<th>Action</th>' +

      '</tr>' +

      '</thead>' +

      '<tbody>';


    menuData.forEach(function(item){

      let image = "No Image";


      if(item.image){

        image =
          '<img ' +
          'class="menu-image" ' +
          'src="' +
          esc(item.image) +
          '" ' +
          'alt="' +
          esc(item.name) +
          '">';

      }


      html +=

        "<tr>" +

        "<td>#" +
        esc(item.id) +
        "</td>" +

        "<td>" +
        image +
        "</td>" +

        "<td>" +

        "<b>" +
        esc(item.name) +
        "</b>" +

        "<br>" +

        "<small>" +
        esc(
          item.description || ""
        ) +
        "</small>" +

        "</td>" +

        "<td>" +
        esc(
          item.category || ""
        ) +
        "</td>" +

        "<td>" +

        "<b>₹" +
        Number(
          item.price || 0
        ).toFixed(0) +
        "</b>" +

        "</td>" +

        "<td>" +

        (
          Number(item.available) === 1
            ? "✅ Available"
            : "❌ Hidden"
        ) +

        "</td>" +

        "<td>" +

        '<button class="edit" ' +
        'onclick="editMenu(' +
        item.id +
        ')">' +
        'Edit' +
        '</button>' +

        '<button class="hide" ' +
        'onclick="toggleMenu(' +
        item.id +
        ')">' +

        (
          Number(item.available) === 1
            ? "Hide"
            : "Show"
        ) +

        '</button>' +

        '<button class="delete" ' +
        'onclick="deleteMenu(' +
        item.id +
        ')">' +
        'Delete' +
        '</button>' +

        "</td>" +

        "</tr>";

    });


    html +=
      "</tbody>" +
      "</table>" +
      "</div>";


    box.innerHTML = html;


  }catch(error){

    box.innerHTML =
      '<div class="error">' +
      esc(
        "Menu Error: " +
        error.message
      ) +
      '</div>';

  }

}


/* =================================
   ADD / EDIT MENU
================================= */

document
.getElementById("menuForm")
.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const id =
      document.getElementById(
        "menuId"
      ).value;


    const data = {

      name:
        document.getElementById(
          "menuName"
        ).value.trim(),

      category:
        document.getElementById(
          "menuCategory"
        ).value.trim(),

      description:
        document.getElementById(
          "menuDescription"
        ).value.trim(),

      price:
        Number(
          document.getElementById(
            "menuPrice"
          ).value
        ),

      image:
        document.getElementById(
          "menuImage"
        ).value.trim(),

      available:
        Number(
          document.getElementById(
            "menuAvailable"
          ).value
        )

    };


    if(!data.name){

      alert(
        "Menu Name দিন।"
      );

      return;

    }


    try{

      if(id){

        await api(
          "/api/admin/menu/" + id,
          {

            method:"PATCH",

            headers:{
              "Content-Type":
              "application/json"
            },

            body:
              JSON.stringify(data)

          }
        );


        alert(
          "Menu updated successfully."
        );

      }else{

        await api(
          "/api/admin/menu",
          {
