<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Choice Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#111827;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}
button{border:0;border-radius:7px;padding:9px 12px;font-weight:bold;cursor:pointer}
.refresh{background:#2563eb;color:#fff}
.container{max-width:1200px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
.stat{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stat-title{color:#666;font-size:13px}.stat-value{font-size:27px;font-weight:bold;margin-top:7px}
.section{background:#fff;padding:15px;margin-bottom:18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.section h2{margin-top:0;font-size:19px}.table-wrap{overflow-x:auto}
table{width:100%;min-width:800px;border-collapse:collapse}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
th{background:#f3f4f6}.loading{text-align:center;padding:20px;color:#666}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:7px;margin-bottom:10px}
.success{background:#dcfce7;color:#166534;padding:12px;border-radius:7px;margin-bottom:10px}
select,input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:80px;resize:vertical}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}.add{background:#2563eb;color:#fff}.update{background:#16a34a;color:#fff;margin:2px}
.edit{background:#f59e0b;color:#fff;margin:2px}.delete{background:#dc2626;color:#fff;margin:2px}
.hide{background:#6366f1;color:#fff;margin:2px}.call{background:#2563eb;color:#fff;margin:2px}
.whatsapp{background:#16a34a;color:#fff;margin:2px}.menu-image{width:70px;height:55px;object-fit:cover;border-radius:6px}
.small-note{color:#666;font-size:12px}
@media(max-width:700px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}
header{flex-direction:column;gap:10px;align-items:flex-start}}
</style>
</head>

<body>
<header>
  <h1>Your Choice Admin</h1>
  <button class="refresh" id="refreshButton">⟳ Refresh All</button>
</header>

<div class="container">
  <div id="globalMessage"></div>

  <div class="stats">
    <div class="stat"><div class="stat-title">Total Orders</div><div id="totalOrders" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-title">Pending Orders</div><div id="pendingOrders" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-title">Total Sales</div><div id="totalSales" class="stat-value">₹0</div></div>
  </div>

  <div class="section">
    <h2>🛒 Customer Orders</h2>
    <div id="ordersMessage"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="7" class="loading">Loading orders...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>📅 Table Bookings</h2>
    <div id="bookingsMessage"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="bookingsBody"><tr><td colspan="8" class="loading">Loading bookings...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>🍽️ Menu Management</h2>
    <div id="menuMessage"></div>
    <form id="menuForm" class="form">
      <input type="hidden" id="menuId">
      <input type="text" id="menuName" placeholder="Menu Name" required>
      <input type="text" id="menuCategory" placeholder="Category">
      <input type="number" id="menuPrice" placeholder="Price" min="0" required>
      <input type="text" id="menuImage" placeholder="images/chicken-biryani.jpg">
      <textarea id="menuDescription" class="full" placeholder="Description"></textarea>
      <select id="menuAvailable"><option value="1">Available</option><option value="0">Not Available</option></select>
      <div>
        <button type="submit" class="add" id="saveButton">➕ Add Menu</button>
        <button type="button" id="cancelButton" style="display:none;background:#6b7280;color:#fff;">Cancel</button>
      </div>
    </form>
  </div>

  <div class="section">
    <h2>📋 Current Menu</h2>
    <div id="currentMenu"><div class="loading">Loading menu...</div></div>
  </div>
</div>

<script>
"use strict";

const API = "https://1251file.xboy7334.workers.dev";
let menuData = [];

function $(id){return document.getElementById(id)}

function showMessage(id,message,type){
  const box=$(id);
  if(!box)return;
  box.innerHTML='<div class="'+type+'">'+escapeHtml(message)+'</div>';
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   ADMIN ORDER TIME
   Convert UTC / SQLite timestamp to India Standard Time
========================================================= */
function formatAdminDateTime(value){
  if(!value)return "Time not available";

  try{
    let dateString=String(value).trim();

    if(
      !dateString.endsWith("Z") &&
      !/[+-]\d{2}:\d{2}$/.test(dateString)
    ){
      dateString=dateString.replace(" ","T")+"Z";
    }

    const date=new Date(dateString);

    if(Number.isNaN(date.getTime())){
      return escapeHtml(value);
    }

    return date.toLocaleString("en-IN",{
      timeZone:"Asia/Kolkata",
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    });
  }catch(error){
    return escapeHtml(value);
  }
}

async function api(path,options){
  const response=await fetch(API+path,options||{});
  const text=await response.text();
  let data={};

  try{data=text?JSON.parse(text):{}}
  catch(e){throw new Error("Server returned invalid JSON. HTTP "+response.status)}

  if(!response.ok){
    throw new Error(data.message||data.error||("HTTP "+response.status));
  }

  return data;
}

function option(value,selected){
  return '<option value="'+escapeHtml(value)+'"'+
    (String(value)===String(selected)?" selected":"")+">"+
    escapeHtml(value)+"</option>";
}

function callCustomer(phone){
  if(!phone){alert("Phone number নেই");return}
  window.location.href="tel:"+String(phone).replace(/[^\d+]/g,"");
}

function whatsapp(phone,name){
  if(!phone){alert("Phone number নেই");return}
  let number=String(phone).replace(/\D/g,"");
  if(number.length===10)number="91"+number;
  const message=encodeURIComponent(
    "Hello "+(name||"Customer")+", Your Choice Family Restaurant থেকে যোগাযোগ করছি।"
  );
  window.open("https://wa.me/"+number+"?text="+message,"_blank");
}

async function loadAll(){
  $("ordersBody").innerHTML='<tr><td colspan="7" class="loading">Loading orders...</td></tr>';
  $("bookingsBody").innerHTML='<tr><td colspan="8" class="loading">Loading bookings...</td></tr>';
  $("currentMenu").innerHTML='<div class="loading">Loading menu...</div>';

  await Promise.allSettled([loadOrders(),loadBookings(),loadMenu()]);
}

async function loadOrders(){
  const body=$("ordersBody");

  try{
    const data=await api("/api/admin/orders");
    const orders=Array.isArray(data.orders)?data.orders:[];

    $("totalOrders").textContent=orders.length;

    let pending=0;
    let sales=0;

    orders.forEach(function(order){
      if(String(order.status)==="Pending")pending++;
      sales+=Number(order.total_amount||0);
    });

    $("pendingOrders").textContent=pending;
    $("totalSales").textContent="₹"+sales.toFixed(0);

    if(!orders.length){
      body.innerHTML='<tr><td colspan="7" class="loading">কোনো Order নেই</td></tr>';
      return;
    }

    body.innerHTML="";

    orders.forEach(function(order){
      const row=document.createElement("tr");

      let items="—";
      if(Array.isArray(order.items)&&order.items.length){
        items=order.items.map(function(item){
          return escapeHtml(item.item_name)+" × "+escapeHtml(item.quantity)+" — ₹"+escapeHtml(item.price);
        }).join("<br>");
      }

      row.innerHTML=
        "<td><b>#"+escapeHtml(order.id)+"</b><br>"+
        "<small>"+formatAdminDateTime(order.created_at)+"</small></td>"+

        "<td><b>"+escapeHtml(order.customer_name||"")+"</b><br>"+
        escapeHtml(order.phone||"")+"<br>"+
        escapeHtml(order.address||"")+"<br>"+
        '<button type="button" class="call">📞 Call</button>'+
        '<button type="button" class="whatsapp">WhatsApp</button></td>'+

        "<td>"+items+"</td>"+
        "<td><b>₹"+Number(order.total_amount||0).toFixed(0)+"</b></td>"+
        "<td>"+escapeHtml(order.payment_method||"COD")+"</td>"+

        "<td><select class=\"orderStatus\">"+
        option("Pending",order.status)+
        option("Confirmed",order.status)+
        option("Preparing",order.status)+
        option("Delivered",order.status)+
        option("Cancelled",order.status)+
        "</select></td>"+

        '<td><button type="button" class="update">Update</button></td>';

      row.querySelector(".update").addEventListener("click",function(){
        const status=row.querySelector(".orderStatus").value;
        updateOrder(order.id,status);
      });

      row.querySelector(".call").addEventListener("click",function(){
        callCustomer(order.phone);
      });

      row.querySelector(".whatsapp").addEventListener("click",function(){
        whatsapp(order.phone,order.customer_name);
      });

      body.appendChild(row);
    });

  }catch(error){
    $("totalOrders").textContent="0";
    $("pendingOrders").textContent="0";
    $("totalSales").textContent="₹0";

    body.innerHTML='<tr><td colspan="7" class="error">Order Error: '+escapeHtml(error.message)+"</td></tr>";
  }
}

async function updateOrder(id,status){
  try{
    await api("/api/admin/orders/"+encodeURIComponent(id),{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:status})
    });

    alert("Order status updated.");
    await loadOrders();
  }catch(error){
    alert("Order update failed: "+error.message);
  }
}

async function loadBookings(){
  const body=$("bookingsBody");

  try{
    const data=await api("/api/admin/bookings");
    const bookings=Array.isArray(data.bookings)?data.bookings:[];

    if(!bookings.length){
      body.innerHTML='<tr><td colspan="8" class="loading">কোনো Table Booking নেই</td></tr>';
      return;
    }

    body.innerHTML="";

    bookings.forEach(function(booking){
      const row=document.createElement("tr");

      row.innerHTML=
        "<td>#"+escapeHtml(booking.id)+"</td>"+
        "<td>"+escapeHtml(booking.customer_name||"")+"</td>"+
        "<td>"+escapeHtml(booking.phone||"")+"<br>"+
        '<button type="button" class="call">📞 Call</button>'+
        '<button type="button" class="whatsapp">WhatsApp</button></td>'+
        "<td>"+escapeHtml(booking.booking_date||"")+"</td>"+
        "<td>"+escapeHtml(booking.booking_time||"")+"</td>"+
        "<td>"+escapeHtml(booking.guests||"")+"</td>"+
        "<td><select class=\"bookingStatus\">"+
        option("Pending",booking.status)+
        option("Confirmed",booking.status)+
        option("Completed",booking.status)+
        option("Cancelled",booking.status)+
        "</select></td>"+
        '<td><button type="button" class="update">Update</button></td>';

      row.querySelector(".update").addEventListener("click",function(){
        const status=row.querySelector(".bookingStatus").value;
        updateBooking(booking.id,status);
      });

      row.querySelector(".call").addEventListener("click",function(){
        callCustomer(booking.phone);
      });

      row.querySelector(".whatsapp").addEventListener("click",function(){
        whatsapp(booking.phone,booking.customer_name);
      });

      body.appendChild(row);
    });

  }catch(error){
    body.innerHTML='<tr><td colspan="8" class="error">Booking Error: '+escapeHtml(error.message)+"</td></tr>";
  }
}

async function updateBooking(id,status){
  try{
    await api("/api/admin/bookings/"+encodeURIComponent(id),{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:status})
    });

    alert("Booking status updated.");
    await loadBookings();
  }catch(error){
    alert("Booking update failed: "+error.message);
  }
}

async function loadMenu(){
  const box=$("currentMenu");

  try{
    const data=await api("/api/admin/menu");
    menuData=Array.isArray(data.menu)?data.menu:[];

    if(!menuData.length){
      box.innerHTML='<div class="loading">কোনো Menu নেই</div>';
      return;
    }

    let html='<div class="table-wrap"><table><thead><tr>'+
      "<th>ID</th><th>Image</th><th>Name</th><th>Category</th>"+
      "<th>Price</th><th>Available</th><th>Action</th>"+
      "</tr></thead><tbody>";

    menuData.forEach(function(item){
      const image=item.image
        ? '<img class="menu-image" src="'+escapeHtml(item.image)+
          '" alt="'+escapeHtml(item.name)+'" onerror="this.style.display=\'none\'">'
        :"No Image";

      html+="<tr>"+
        "<td>#"+escapeHtml(item.id)+"</td>"+
        "<td>"+image+"</td>"+
        "<td><b>"+escapeHtml(item.name)+"</b><br><small>"+escapeHtml(item.description||"")+"</small></td>"+
        "<td>"+escapeHtml(item.category||"")+"</td>"+
        "<td><b>₹"+Number(item.price||0).toFixed(0)+"</b></td>"+
        "<td>"+(Number(item.available)===1?"✅ Available":"❌ Hidden")+"</td>"+
        "<td><button type=\"button\" class=\"edit\">Edit</button>"+
        "<button type=\"button\" class=\"hide\">"+(Number(item.available)===1?"Hide":"Show")+"</button>"+
        "<button type=\"button\" class=\"delete\">Delete</button></td>"+
        "</tr>";
    });

    html+="</tbody></table></div>";
    box.innerHTML=html;

    const rows=box.querySelectorAll("tbody tr");

    menuData.forEach(function(item,index){
      const row=rows[index];
      row.querySelector(".edit").addEventListener("click",function(){editMenu(item.id)});
      row.querySelector(".hide").addEventListener("click",function(){toggleMenu(item.id)});
      row.querySelector(".delete").addEventListener("click",function(){deleteMenu(item.id)});
    });

  }catch(error){
    box.innerHTML='<div class="error">Menu Error: '+escapeHtml(error.message)+"</div>";
  }
}

function resetMenuForm(){
  $("menuId").value="";
  $("menuName").value="";
  $("menuCategory").value="";
  $("menuPrice").value="";
  $("menuImage").value="";
  $("menuDescription").value="";
  $("menuAvailable").value="1";
  $("saveButton").textContent="➕ Add Menu";
  $("cancelButton").style.display="none";
}

function editMenu(id){
  const item=menuData.find(function(menu){return Number(menu.id)===Number(id)});
  if(!item){alert("Menu item পাওয়া যায়নি।");return}

  $("menuId").value=item.id;
  $("menuName").value=item.name||"";
  $("menuCategory").value=item.category||"";
  $("menuPrice").value=item.price??"";
  $("menuImage").value=item.image||"";
  $("menuDescription").value=item.description||"";
  $("menuAvailable").value=Number(item.available)===1?"1":"0";
  $("saveButton").textContent="💾 Update Menu";
  $("cancelButton").style.display="inline-block";

  window.scrollTo({top:$("menuForm").getBoundingClientRect().top+window.scrollY-20,behavior:"smooth"});
}

async function toggleMenu(id){
  const item=menuData.find(function(menu){return Number(menu.id)===Number(id)});
  if(!item)return;

  const newAvailable=Number(item.available)===1?0:1;

  try{
    await api("/api/admin/menu/"+encodeURIComponent(id),{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({available:newAvailable})
    });
    await loadMenu();
  }catch(error){
    alert("Menu status update failed: "+error.message);
  }
}

async function deleteMenu(id){
  const item=menuData.find(function(menu){return Number(menu.id)===Number(id)});
  if(!item)return;
  if(!confirm('Delete "'+item.name+'"?'))return;

  try{
    await api("/api/admin/menu/"+encodeURIComponent(id),{method:"DELETE"});
    await loadMenu();
  }catch(error){
    alert("Menu delete failed: "+error.message);
  }
}

$("menuForm").addEventListener("submit",async function(event){
  event.preventDefault();

  const id=$("menuId").value.trim();

  const data={
    name:$("menuName").value.trim(),
    category:$("menuCategory").value.trim(),
    description:$("menuDescription").value.trim(),
    price:Number($("menuPrice").value),
    image:$("menuImage").value.trim(),
    available:Number($("menuAvailable").value)
  };

  if(!data.name){alert("Menu Name দিন।");return}
  if(!Number.isFinite(data.price)||data.price<0){alert("সঠিক Price দিন।");return}

  const saveButton=$("saveButton");
  saveButton.disabled=true;

  try{
    if(id){
      await api("/api/admin/menu/"+encodeURIComponent(id),{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
      });
      alert("Menu updated successfully.");
    }else{
      await api("/api/admin/menu",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
      });
      alert("Menu added successfully.");
    }

    resetMenuForm();
    await loadMenu();
  }catch(error){
    alert("Menu save failed: "+error.message);
  }finally{
    saveButton.disabled=false;
  }
});

$("cancelButton").addEventListener("click",function(){resetMenuForm()});
$("refreshButton").addEventListener("click",function(){loadAll()});

window.addEventListener("error",function(event){
  const box=$("globalMessage");
  if(box)box.innerHTML='<div class="error">JavaScript Error: '+escapeHtml(event.message||"Unknown error")+"</div>";
});

window.addEventListener("unhandledrejection",function(event){
  const box=$("globalMessage");
  if(box){
    const message=event.reason&&event.reason.message?event.reason.message:String(event.reason||"Unknown Promise Error");
    box.innerHTML='<div class="error">Promise Error: '+escapeHtml(message)+"</div>";
  }
});

document.addEventListener("DOMContentLoaded",function(){loadAll()});
</script>
</body>
</html>
