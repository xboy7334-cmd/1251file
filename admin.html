<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Your Choice Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111;
}

.header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

.header h1{
margin:0 0 12px;
}

.container{
max-width:950px;
margin:auto;
padding:15px;
}

button{
border:0;
cursor:pointer;
padding:11px 16px;
border-radius:8px;
font-weight:bold;
}

.refresh{
background:#2563eb;
color:white;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.stat{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat strong{
display:block;
font-size:28px;
margin-top:8px;
}

.section{
background:white;
padding:18px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
}

.section h2{
margin-top:0;
}

.order,
.booking{
background:#fff;
padding:16px;
margin-top:15px;
border-radius:10px;
box-shadow:0 2px 7px #ddd;
}

.header-row{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
}

.status{
background:#f59e0b;
color:white;
padding:6px 10px;
border-radius:20px;
font-size:13px;
}

.info{
line-height:1.8;
margin-top:10px;
}

.items{
background:#f8fafc;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.item{
padding:7px 0;
border-bottom:1px solid #ddd;
}

.total{
font-size:19px;
font-weight:bold;
margin-top:12px;
}

.contact{
display:flex;
gap:10px;
margin-top:10px;
}

.call{
background:#2563eb;
color:white;
}

.whatsapp{
background:#16a34a;
color:white;
}

select{
width:100%;
padding:11px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

.update{
width:100%;
margin-top:10px;
background:#16a34a;
color:white;
}

.success{
background:#dcfce7;
color:#166534;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.loading{
text-align:center;
padding:20px;
}

@media(max-width:600px){

.stats{
grid-template-columns:1fr;
}

.contact{
flex-direction:column;
}

.contact button{
width:100%;
}

}

</style>

</head>

<body>

<div class="header">

<h1>🍽️ Your Choice Admin</h1>

<button
class="refresh"
onclick="loadAll()">
🔄 Refresh All
</button>

</div>


<div class="container">


<!-- STATS -->

<div class="stats">

<div class="stat">
Total Orders
<strong id="totalOrders">0</strong>
</div>

<div class="stat">
Pending Orders
<strong id="pendingOrders">0</strong>
</div>

<div class="stat">
Total Sales
<strong>
₹<span id="totalSales">0</span>
</strong>
</div>

</div>


<!-- ORDERS -->

<div class="section">

<h2>📦 Customer Orders</h2>

<div id="orders"
class="loading">
Loading orders...
</div>

</div>


<!-- BOOKINGS -->

<div class="section">

<h2>📅 Table Bookings</h2>

<div id="bookings"
class="loading">
Loading bookings...
</div>

</div>


</div>


<script>


// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders(){

const box =
document.getElementById("orders");

try{

const response =
await fetch("/api/admin/orders?x="
+ Date.now());

const data =
await response.json();

if(!data.success){

throw new Error(
"Order API failed"
);

}

const orders =
data.orders || [];


document.getElementById(
"totalOrders"
).textContent =
orders.length;


let pending = 0;

let sales = 0;


orders.forEach(function(order){

if(order.status === "Pending"){
pending++;
}

sales += Number(
order.total_amount || 0
);

});


document.getElementById(
"pendingOrders"
).textContent =
pending;


document.getElementById(
"totalSales"
).textContent =
sales.toFixed(0);


if(orders.length === 0){

box.innerHTML =
"<div>No orders found.</div>";

return;

}


box.className = "";


box.innerHTML = "";


orders.forEach(function(order){

let items = "";


(order.items || [])
.forEach(function(item){

items += `
<div class="item">
${item.item_name}
× ${item.quantity}
— ₹${Number(item.price) *
Number(item.quantity)}
</div>
`;

});


const phone =
String(order.phone || "")
.replace(/\D/g,"");


box.innerHTML += `

<div class="order">

<div class="header-row">

<h3>
📦 Order #${order.id}
</h3>

<span class="status">
${order.status || "Pending"}
</span>

</div>


<div class="info">

<b>Customer:</b>
${order.customer_name || "-"}
<br>

<b>Phone:</b>
${order.phone || "-"}


<div class="contact">

<button
class="call"
onclick="callCustomer('${phone}')">
📞 Call
</button>

<button
class="whatsapp"
onclick="sendWhatsApp('${phone}','${order.id}')">
💬 WhatsApp
</button>

</div>


<br>

<b>Address:</b>
${order.address || "-"}

<br>

<b>Payment:</b>
${order.payment_method || "COD"}

<br>

<b>Date:</b>
${order.created_at || ""}

</div>


<div class="items">

<b>Items</b>

${items}

</div>


<div class="total">

Total:
₹${order.total_amount}

</div>


<select
id="orderStatus${order.id}">

<option value="Pending">
🟡 Pending
</option>

<option value="Confirmed">
🔵 Confirmed
</option>

<option value="Preparing">
🟠 Preparing
</option>

<option value="Delivered">
🟢 Delivered
</option>

<option value="Cancelled">
🔴 Cancelled
</option>

</select>


<button
class="update"
onclick="updateOrder(${order.id})">

✅ Update Order Status

</button>


<div id="orderResult${order.id}">
</div>

</div>

`;

document.getElementById(
"orderStatus" + order.id
).value =
order.status || "Pending";

});

}catch(error){

console.error(error);

box.innerHTML = `
<div class="error">
❌ Orders load হচ্ছে না.
<br><br>
${error.message}
</div>
`;

}

}


// =====================================
// LOAD BOOKINGS
// =====================================

async function loadBookings(){

const box =
document.getElementById("bookings");

try{

const response =
await fetch("/api/admin/bookings?x="
+ Date.now());

const data =
await response.json();

if(!data.success){

throw new Error(
"Booking API failed"
);

}

const bookings =
data.bookings || [];


if(bookings.length === 0){

box.innerHTML =
"<div>No bookings found.</div>";

return;

}


box.className = "";

box.innerHTML = "";


bookings.forEach(function(booking){

const phone =
String(booking.phone || "")
.replace(/\D/g,"");


box.innerHTML += `

<div class="booking">

<div class="header-row">

<h3>
📅 Booking #${booking.id}
</h3>

<span class="status">
${booking.status || "Pending"}
</span>

</div>


<div class="info">

<b>Customer:</b>
${booking.customer_name || "-"}
<br>

<b>Phone:</b>
${booking.phone || "-"}


<div class="contact">

<button
class="call"
onclick="callCustomer('${phone}')">
📞 Call
</button>

<button
class="whatsapp"
onclick="bookingWhatsApp('${phone}','${booking.id}')">
💬 WhatsApp
</button>

</div>


<br>

<b>Booking Date:</b>
${booking.booking_date || "-"}

<br>

<b>Booking Time:</b>
${booking.booking_time || "-"}

<br>

<b>Guests:</b>
${booking.guests || "-"}

<br>

<b>Created:</b>
${booking.created_at || ""}

</div>


<select
id="bookingStatus${booking.id}">

<option value="Pending">
🟡 Pending
</option>

<option value="Confirmed">
🔵 Confirmed
</option>

<option value="Completed">
🟢 Completed
</option>

<option value="Cancelled">
🔴 Cancelled
</option>

</select>


<button
class="update"
onclick="updateBooking(${booking.id})">

✅ Update Booking Status

</button>


<div id="bookingResult${booking.id}">
</div>

</div>

`;

document.getElementById(
"bookingStatus" + booking.id
).value =
booking.status || "Pending";

});

}catch(error){

console.error(error);

box.innerHTML = `
<div class="error">
❌ Bookings load হচ্ছে না.
<br><br>
${error.message}
</div>
`;

}

}


// =====================================
// UPDATE ORDER
// =====================================

async function updateOrder(id){

const status =
document.getElementById(
"orderStatus" + id
).value;


const result =
document.getElementById(
"orderResult" + id
);


try{

const response =
await fetch(
"/api/admin/orders/" + id,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status:status
})

}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.message ||
"Update failed"
);

}


result.innerHTML = `
<div class="success">
✅ Order status updated:
<b>${status}</b>
</div>
`;


setTimeout(
loadOrders,
800
);


}catch(error){

result.innerHTML = `
<div class="error">
❌ ${error.message}
</div>
`;

}

}


// =====================================
// UPDATE BOOKING
// =====================================

async function updateBooking(id){

const status =
document.getElementById(
"bookingStatus" + id
).value;


const result =
document.getElementById(
"bookingResult" + id
);


try{

const response =
await fetch(
"/api/admin/bookings/" + id,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status:status
})

}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.message ||
"Update failed"
);

}


result.innerHTML = `
<div class="success">
✅ Booking status updated:
<b>${status}</b>
</div>
`;


setTimeout(
loadBookings,
800
);


}catch(error){

result.innerHTML = `
<div class="error">
❌ ${error.message}
</div>
`;

}

}


// =====================================
// CALL
// =====================================

function callCustomer(phone){

if(!phone){

alert(
"Phone number পাওয়া যায়নি"
);

return;

}

window.location.href =
"tel:" + phone;

}


// =====================================
// WHATSAPP ORDER
// =====================================

function sendWhatsApp(
phone,
orderId
){

if(!phone){

alert(
"Phone number পাওয়া যায়নি"
);

return;

}

const text =
"Hello, this is Your Choice Family Restaurant regarding your Order #" +
orderId +
".";

window.open(
"https://wa.me/" +
phone +
"?text=" +
encodeURIComponent(text),
"_blank"
);

}


// =====================================
// WHATSAPP BOOKING
// =====================================

function bookingWhatsApp(
phone,
bookingId
){

if(!phone){

alert(
"Phone number পাওয়া যায়নি"
);

return;

}

const text =
"Hello, this is Your Choice Family Restaurant regarding your Table Booking #" +
bookingId +
".";

window.open(
"https://wa.me/" +
phone +
"?text=" +
encodeURIComponent(text),
"_blank"
);

}


// =====================================
// START
// =====================================

function loadAll(){

loadOrders();

loadBookings();

}


loadAll();

</script>

</body>
</html>
