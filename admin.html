<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Choice Admin</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:15px;
}

button{
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:8px;
    font-size:16px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px #ddd;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.order{
    background:white;
    margin-bottom:15px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 8px #ddd;
}

.order h3{
    margin-top:0;
}

.items{
    background:#f9fafb;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}

.item{
    padding:7px 0;
    border-bottom:1px solid #ddd;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:12px;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:8px;
}

@media(max-width:600px){
    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🍽️ Your Choice Admin</h1>
    <button onclick="loadOrders()">🔄 Refresh Orders</button>
</div>

<div class="container">

    <div class="stats">

        <div class="stat">
            Total Orders
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            Pending Orders
            <strong id="pendingOrders">0</strong>
        </div>

        <div class="stat">
            Total Sales
            <strong>₹<span id="totalSales">0</span></strong>
        </div>

    </div>

    <div id="message">Loading orders...</div>

    <div id="orders"></div>

</div>

<script>

const API =
"https://1251file.xboy7334.workers.dev/api/admin/orders";

async function loadOrders(){

    const message =
        document.getElementById("message");

    const ordersBox =
        document.getElementById("orders");

    message.innerHTML = "⏳ Loading orders...";
    ordersBox.innerHTML = "";

    try{

        const response = await fetch(API, {
            method: "GET",
            cache: "no-store"
        });

        const data = await response.json();

        console.log(data);

        if(!data.success){

            throw new Error(
                data.message || "API error"
            );
        }

        const orders = data.orders || [];

        document.getElementById("totalOrders")
            .textContent = orders.length;

        let pending = 0;
        let sales = 0;

        orders.forEach(function(order){

            if(order.status === "Pending"){
                pending++;
            }

            sales += Number(order.total_amount || 0);

        });

        document.getElementById("pendingOrders")
            .textContent = pending;

        document.getElementById("totalSales")
            .textContent = sales.toFixed(0);

        message.innerHTML = "";

        if(orders.length === 0){

            ordersBox.innerHTML =
                "<div class='order'>No orders found.</div>";

            return;
        }

        orders.forEach(function(order){

            let itemsHTML = "";

            (order.items || []).forEach(function(item){

                const itemTotal =
                    Number(item.price) *
                    Number(item.quantity);

                itemsHTML += `
                    <div class="item">
                        ${item.item_name}
                        × ${item.quantity}
                        — ₹${itemTotal}
                    </div>
                `;

            });

            const html = `

                <div class="order">

                    <h3>
                        📦 Order #${order.id}
                    </h3>

                    <p>
                        <b>Customer:</b>
                        ${order.customer_name || "-"}
                    </p>

                    <p>
                        <b>Phone:</b>
                        <a href="tel:${order.phone}">
                            ${order.phone || "-"}
                        </a>
                    </p>

                    <p>
                        <b>Address:</b>
                        ${order.address || "-"}
                    </p>

                    <p>
                        <b>Payment:</b>
                        ${order.payment_method || "COD"}
                    </p>

                    <p>
                        <b>Status:</b>
                        ${order.status || "Pending"}
                    </p>

                    <div class="items">

                        <b>Items</b>

                        ${itemsHTML}

                    </div>

                    <div class="total">
                        Total: ₹${order.total_amount}
                    </div>

                    <p>
                        <small>
                            ${order.created_at || ""}
                        </small>
                    </p>

                </div>

            `;

            ordersBox.innerHTML += html;

        });

    }catch(error){

        console.error(error);

        message.innerHTML = `
            <div class="error">
                ❌ Orders load হচ্ছে না.<br><br>
                ${error.message}
            </div>
        `;

    }

}

loadOrders();

</script>

</body>
</html>
