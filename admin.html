<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Choice Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .refresh-btn {
      background: #2563eb;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .stat-title {
      color: #666;
      font-size: 14px;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 18px;
      margin-bottom: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f3f4f6;
    }

    .loading {
      padding: 18px;
      text-align: center;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .status {
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    .update-btn {
      background: #16a34a;
      color: white;
    }

    .call-btn {
      background: #2563eb;
      color: white;
      margin: 3px 2px;
    }

    .whatsapp-btn {
      background: #16a34a;
      color: white;
      margin: 3px 2px;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
      margin: 2px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      margin: 2px;
    }

    .toggle-btn {
      background: #6366f1;
      color: white;
      margin: 2px;
    }

    .menu-form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .menu-form input,
    .menu-form textarea,
    .menu-form select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .menu-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .save-btn {
      background: #2563eb;
      color: white;
    }

    .cancel-btn {
      background: #6b7280;
      color: white;
      margin-left: 5px;
    }

    .menu-image {
      width: 70px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    .small-text {
      color: #666;
      font-size: 12px;
    }

    .js-test {
      background: red;
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .menu-form {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Your Choice Admin</h1>

  <button id="refreshButton" class="refresh-btn">
    ⟳ Refresh All
  </button>
</header>

<div class="container">

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Total Orders</div>
      <div id="totalOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Pending Orders</div>
      <div id="pendingOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Total Sales</div>
      <div id="totalSales" class="stat-value">₹0</div>
    </div>

  </div>


  <!-- ORDERS -->

  <div class="section">

    <h2>🛒 Customer Orders</h2>

    <div id="ordersMessage"></div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="ordersBody">

          <tr>
            <td colspan="7" class="loading">
              Loading orders...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <!-- BOOKINGS -->

  <div class="section">

    <h2>📅 Table Bookings</h2>

    <div id="bookingsMessage"></div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Date</th>
            <th>Time</th>
            <th>Guests</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="bookingsBody">

          <tr>
            <td colspan="8" class="loading">
              Loading bookings...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <!-- MENU MANAGEMENT -->

  <div class="section">

    <h2>🍽️ Menu Management</h2>

    <div id="menuMessage"></div>

    <form id="menuForm" class="menu-form">

      <input type="hidden" id="menuId">

      <input
        type="text"
        id="menuName"
        placeholder="Menu Name"
        required
      >

      <input
        type="text"
        id="menuCategory"
        placeholder="Category"
      >

      <input
        type="number"
        id="menuPrice"
        placeholder="Price"
        min="0"
        step="0.01"
        required
      >

      <input
        type="text"
        id="menuImage"
        placeholder="images/chicken-biryani.jpg"
      >

      <textarea
        id="menuDescription"
        class="full"
        placeholder="Description"
      ></textarea>

      <select id="menuAvailable">

        <option value="1">
          Available
        </option>

        <option value="0">
          Not Available
        </option>

      </select>

      <div>

        <button
          type="submit"
          id="saveMenuButton"
          class="save-btn"
        >
          ➕ Add Menu
        </button>

        <button
          type="button"
          id="cancelEditButton"
          class="cancel-btn"
          style="display:none;"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>


  <!-- CURRENT MENU -->

  <div class="section">

    <h2>📋 Current Menu</h2>

    <div id="currentMenu">

      <div class="loading">
        Loading menu...
      </div>

    </div>

  </div>

</div>


<script>

const API = "https://1251file.xboy7334.workers.dev";

let menuCache = [];


/* ================================
   BASIC HELPERS
================================ */

function $(id) {
  return document.getElementById(id);
}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function showMessage(id, message, type) {

  const element = $(id);

  if (!element) {
    return;
  }

  element.innerHTML =
    '<div class="' +
    type +
    '">' +
    escapeHTML(message) +
    "</div>";
}


function clearMessage(id) {

  const element = $(id);

  if (element) {
    element.innerHTML = "";
  }
}


/* ================================
   API
================================ */

async function apiRequest(path, options = {}) {

  const response = await fetch(
    API + path,
    options
  );

  const text = await response.text();

  let data;

  try {

    data = JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Server response ঠিক নয়। HTTP " +
      response.status
    );

  }

  if (!response.ok) {

    throw new Error(
      data.message ||
      ("HTTP Error " + response.status)
    );

  }

  if (data.success === false) {

    throw new Error(
      data.message ||
      "API Error"
    );

  }

  return data;
}


/* ================================
   ORDERS
================================ */

async function loadOrders() {

  const body = $("ordersBody");

  body.innerHTML =
    '<tr>' +
    '<td colspan="7" class="loading">' +
    'Loading orders...' +
    '</td>' +
    '</tr>';

  try {

    const data =
      await apiRequest("/api/admin/orders");

    const orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];

    $("totalOrders").textContent =
      orders.length;

    let pending = 0;
    let sales = 0;

    orders.forEach(function(order) {

      if (order.status === "Pending") {
        pending++;
      }

      sales += Number(
        order.total_amount || 0
      );

    });

    $("pendingOrders").textContent =
      pending;

    $("totalSales").textContent =
      "₹" + sales.toFixed(0);


    if (orders.length === 0) {

      body.innerHTML =
        '<tr>' +
        '<td colspan="7" class="loading">' +
        'কোনো Order নেই' +
        '</td>' +
        '</tr>';

      return;
    }


    body.innerHTML = "";


    orders.forEach(function(order) {

      const row =
        document.createElement("tr");


      let itemsHTML = "";


      if (Array.isArray(order.items)) {

        order.items.forEach(function(item) {

          itemsHTML +=
            escapeHTML(item.item_name) +
            " × " +
            escapeHTML(item.quantity) +
            " ₹" +
            Number(item.price || 0).toFixed(0) +
            "<br>";

        });

      }


      row.innerHTML =

        "<td>" +
        "<b>#" +
        escapeHTML(order.id) +
        "</b>" +
        "<br>" +
        '<span class="small-text">' +
        escapeHTML(order.created_at || "") +
        "</span>" +
        "</td>" +


        "<td>" +

        "<b>" +
        escapeHTML(order.customer_name || "") +
        "</b>" +

        "<br>" +

        escapeHTML(order.phone || "") +

        "<br>" +

        escapeHTML(order.address || "") +

        "<br>" +

        '<button class="call-btn" ' +
        'data-action="call" ' +
        'data-phone="' +
        escapeHTML(order.phone || "") +
        '">' +
        '📞 Call' +
        '</button>' +

        '<button class="whatsapp-btn" ' +
        'data-action="whatsapp" ' +
        'data-phone="' +
        escapeHTML(order.phone || "") +
        '" data-name="' +
        escapeHTML(order.customer_name || "") +
        '">' +
        'WhatsApp' +
        '</button>' +

        "</td>" +


        "<td>" +
        itemsHTML +
        "</td>" +


        "<td>" +
        "<b>₹" +
        Number(order.total_amount || 0).toFixed(0) +
        "</b>" +
        "</td>" +


        "<td>" +
        escapeHTML(
          order.payment_method || "COD"
        ) +
        "</td>" +


        "<td>" +

        '<select class="status" id="orderStatus_' +
        order.id +
        '">' +

        statusOption("Pending", order.status) +
        statusOption("Confirmed", order.status) +
        statusOption("Preparing", order.status) +
        statusOption("Delivered", order.status) +
        statusOption("Cancelled", order.status) +

        "</select>" +

        "</td>" +


        "<td>" +

        '<button class="update-btn" ' +
        'data-action="update-order" ' +
        'data-id="' +
        order.id +
        '">' +
        'Update' +
        '</button>' +

        "</td>";


      body.appendChild(row);

    });


  } catch (error) {

    body.innerHTML =
      '<tr>' +
      '<td colspan="7" class="error">' +
      escapeHTML(
        "Order Error: " + error.message
      ) +
      '</td>' +
      '</tr>';

    showMessage(
      "ordersMessage",
      error.message,
      "error"
    );

  }

}


function statusOption(value, selected) {

  return (
    '<option value="' +
    value +
    '"' +
    (value === selected ? " selected" : "") +
    ">" +
    value +
    "</option>"
  );

}


/* ================================
   UPDATE ORDER
================================ */

async function updateOrder(id) {

  const select =
    $("orderStatus_" + id);

  if (!select) {
    return;
  }

  try {

    await apiRequest(
      "/api/admin/orders/" + id,
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          status: select.value
        })
      }
    );

    alert(
      "Order status successfully updated."
    );

    await loadOrders();

  } catch (error) {

    alert(
      "Error: " + error.message
    );

  }

}


/* ================================
   BOOKINGS
================================ */

async function loadBookings() {

  const body =
    $("bookingsBody");

  body.innerHTML =
    '<tr>' +
    '<td colspan="8" class="loading">' +
    'Loading bookings...' +
    '</td>' +
    '</tr>';

  try {

    const data =
      await apiRequest(
        "/api/admin/bookings"
      );

    const bookings =
      Array.isArray(data.bookings)
        ? data.bookings
        : [];


    if (bookings.length === 0) {

      body.innerHTML =
        '<tr>' +
        '<td colspan="8" class="loading">' +
        'কোনো Table Booking নেই' +
        '</td>' +
        '</tr>';

      return;
    }


    body.innerHTML = "";


    bookings.forEach(function(booking) {

      const row =
        document.createElement("tr");


      row.innerHTML =

        "<td>#" +
        escapeHTML(booking.id) +
        "</td>" +


        "<td>" +
        escapeHTML(
          booking.customer_name || ""
        ) +
        "</td>" +


        "<td>" +

        escapeHTML(
          booking.phone || ""
        ) +

        "<br>" +

        '<button class="call-btn" ' +
        'data-action="call" ' +
        'data-phone="' +
        escapeHTML(booking.phone || "") +
        '">' +
        '📞 Call' +
        '</button>' +

        '<button class="whatsapp-btn" ' +
        'data-action="booking-whatsapp" ' +
        'data-phone="' +
        escapeHTML(booking.phone || "") +
        '" data-name="' +
        escapeHTML(booking.customer_name || "") +
        '">' +
        'WhatsApp' +
        '</button>' +

        "</td>" +


        "<td>" +
        escapeHTML(
          booking.booking_date || ""
        ) +
        "</td>" +


        "<td>" +
        escapeHTML(
          booking.booking_time || ""
        ) +
        "</td>" +


        "<td>" +
        escapeHTML(
          booking.guests || ""
        ) +
        "</td>" +


        "<td>" +

        '<select class="status" id="bookingStatus_' +
        booking.id +
        '">' +

        bookingStatusOption(
          "Pending",
          booking.status
        ) +

        bookingStatusOption(
          "Confirmed",
          booking.status
        ) +

        bookingStatusOption(
          "Completed",
          booking.status
        ) +

        bookingStatusOption(
          "Cancelled",
          booking.status
        ) +

        "</select>" +

        "</td>" +


        "<td>" +

        '<button class="update-btn" ' +
        'data-action="update-booking" ' +
        'data-id="' +
        booking.id +
        '">' +
        'Update' +
        '</button>' +

        "</td>";


      body.appendChild(row);

    });


  } catch (error) {

    body.innerHTML =
      '<tr>' +
      '<td colspan="8" class="error">' +
      escapeHTML(
        "Booking Error: " +
        error.message
      ) +
      '</td>' +
      '</tr>';

    showMessage(
      "bookingsMessage",
      error.message,
      "error"
    );

  }

}


function bookingStatusOption(
  value,
  selected
) {

  return (
    '<option value="' +
    value +
    '"' +
    (value === selected ? " selected" : "") +
    ">" +
    value +
    "</option>"
  );

}


/* ================================
   UPDATE BOOKING
================================ */

async function updateBooking(id) {

  const select =
    $("bookingStatus_" + id);

  if (!select) {
    return;
  }

  try {

    await apiRequest(
      "/api/admin/bookings/" + id,
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          status: select.value
        })
      }
    );

    alert(
      "Booking status successfully updated."
    );

    await loadBookings();

  } catch (error) {

    alert(
      "Error: " + error.message
    );

  }

}


/* ================================
   MENU
================================ */

async function loadMenu() {

  const container =
    $("currentMenu");

  container.innerHTML =
    '<div class="loading">' +
    'Loading menu...' +
    '</div>';

  try {

    const data =
      await apiRequest(
        "/api/admin/menu"
      );

    menuCache =
      Array.isArray(data.menu)
        ? data.menu
        : [];


    if (menuCache.length === 0) {

      container.innerHTML =
        '<div class="loading">' +
        'কোনো Menu Item নেই' +
        '</div>';

      return;
    }


    let html =

      '<div class="table-wrap">' +
      '<table>' +

      '<thead>' +

      '<tr>' +
      '<th>ID</th>' +
      '<th>Image</th>' +
      '<th>Name</th>' +
      '<th>Category</th>' +
      '<th>Price</th>' +
      '<th>Available</th>' +
      '<th>Action</th>' +
      '</tr>' +

      '</thead>' +

      '<tbody>';


    menuCache.forEach(function(item) {

      let imageHTML = "No Image";


      if (item.image) {

        imageHTML =
          '<img class="menu-image" src="' +
          escapeHTML(item.image) +
          '" alt="' +
          escapeHTML(item.name) +
          '">';

      }


      html +=

        "<tr>" +

        "<td>#" +
        escapeHTML(item.id) +
        "</td>" +


        "<td>" +
        imageHTML +
        "</td>" +


        "<td>" +

        "<b>" +
        escapeHTML(item.name) +
        "</b>" +

        "<br>" +

        '<span class="small-text">' +
        escapeHTML(
          item.description || ""
        ) +
        "</span>" +

        "</td>" +


        "<td>" +
        escapeHTML(
          item.category || ""
        ) +
        "</td>" +


        "<td>" +

        "<b>₹" +
        Number(item.price || 0).toFixed(0) +
        "</b>" +

        "</td>" +


        "<td>" +

        (
          Number(item.available) === 1
            ? "✅ Available"
            : "❌ Hidden"
        ) +

        "</td>" +


        "<td>" +

        '<button class="edit-btn" ' +
        'data-action="edit-menu" ' +
        'data-id="' +
        item.id +
        '">' +
        'Edit' +
        '</button>' +


        '<button class="toggle-btn" ' +
        'data-action="toggle-menu" ' +
        'data-id=
