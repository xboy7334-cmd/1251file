<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Menu | Your Choice Family Restaurant</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       TOP BAR
  ========================== -->

  <header class="topbar">

    <a class="brand" href="index.html">
      <img
        src="images/logo.png"
        alt="Your Choice Family Restaurant logo"
      >

      <span>
        Your Choice
        <small>Family Restaurant</small>
      </span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="index.html#gallery">Gallery</a>
      <a href="index.html#booking">Table Booking</a>
      <a href="index.html#tracking">Track Order</a>
      <a href="index.html#contact">Contact</a>
    </nav>

    <button
      class="cart-btn"
      id="cartBtn"
      type="button"
    >
      Cart <b id="cartCount">0</b>
    </button>

  </header>


  <!-- =========================
       MENU PAGE
  ========================== -->

  <main>

    <section id="menu" class="section">

      <div class="section-head">

        <div>

          <p class="eyebrow">
            OUR MENU
          </p>

          <h1>
            Choose your favourites
          </h1>

          <p>
            Browse our menu category-wise.
          </p>

        </div>


        <input
          id="search"
          type="search"
          placeholder="Search menu…"
          autocomplete="off"
        >

      </div>


      <!-- =========================
           CATEGORY BUTTONS
      ========================== -->

      <div
        id="menuCategories"
        class="menu-categories"
        aria-label="Menu categories"
      >

        <button
          type="button"
          class="category-btn active"
          data-category="all"
        >
          All
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Biryani & Mughlai Dish"
        >
          Biryani & Mughlai
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Soups"
        >
          Soups
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Chinese Starter"
        >
          Chinese Starter
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Chinese Rice"
        >
          Chinese Rice
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Noodles"
        >
          Noodles
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Chinese Main Course"
        >
          Chinese Main Course
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Tandoor & Starter"
        >
          Tandoor & Starter
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Salad & Raita"
        >
          Salad & Raita
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Rice & Pulao"
        >
          Rice & Pulao
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Roti"
        >
          Roti
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Indian Main Course"
        >
          Indian Main Course
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Dal"
        >
          Dal
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Egg"
        >
          Egg
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Chicken"
        >
          Chicken
        </button>

        <button
          type="button"
          class="category-btn"
          data-category="Mutton"
        >
          Mutton
        </button>

      </div>


      <!-- =========================
           MENU ITEMS
           Loaded from D1
      ========================== -->

      <div
        id="menuGrid"
        class="menu-grid"
      ></div>

    </section>

  </main>


  <!-- =========================
       CART DRAWER
  ========================== -->

  <div
    id="cartPanel"
    class="drawer"
  >

    <div class="drawer-head">

      <h2>
        Your Cart
      </h2>

      <button
        id="closeCart"
        type="button"
      >
        ×
      </button>

    </div>


    <div id="cartItems"></div>


    <div class="total">
      Total:
      ₹<span id="total">0</span>
    </div>


    <!-- =========================
         ORDER FORM
    ========================== -->

    <form id="orderForm">

      <input
        required
        name="name"
        placeholder="Customer name"
      >

      <input
        required
        name="phone"
        type="tel"
        placeholder="Mobile number"
      >

      <textarea
        required
        name="address"
        placeholder="Delivery address"
      ></textarea>


      <select name="payment">

        <option>
          Cash on Delivery
        </option>

      </select>


      <button
        class="btn primary"
        type="submit"
      >
        Place Order
      </button>

    </form>

  </div>


  <!-- =========================
       OVERLAY + TOAST
  ========================== -->

  <div id="overlay"></div>

  <div id="toast"></div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>
</html>
